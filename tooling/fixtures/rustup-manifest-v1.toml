manifest-version = "2"
date = "2026-10-24"

[profiles]
minimal = ["rustc", "cargo", "rust-std"]
default = ["rustc", "cargo", "rust-std"]
complete = ["rustc", "cargo", "rust-std"]

[pkg.rust]
version = "1.100.0-nightly (330d31712 2026-09-17)"

[pkg.rust.target.aarch64-apple-darwin]
available = true
components = [
  { pkg = "rustc", target = "aarch64-apple-darwin" },
  { pkg = "cargo", target = "aarch64-apple-darwin" },
  { pkg = "rust-std", target = "aarch64-apple-darwin" },
]

[pkg.rust.target.x86_64-unknown-linux-gnu]
