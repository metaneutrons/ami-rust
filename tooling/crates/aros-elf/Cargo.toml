[package]
name = "aros-elf"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/metaneutrons/ami-rust"
description = "AROS x86-64 ABI-v1 native ELF validation and section compaction"
readme = "README.md"
publish = false
homepage = "https://github.com/metaneutrons/ami-rust"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.11.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
