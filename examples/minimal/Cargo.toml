[package]
name = "ami-rust-minimal"
version.workspace = true
edition.workspace = true
publish = false
autobins = false
autolib = false
license.workspace = true
readme = "README.md"
[[bin]]
name = "ami-rust-minimal"
path = "src/main.rs"

[features]
default = []
alloc = ["aros/alloc"]
[dependencies]
aros = { version = "=0.1.0", path = "../../crates/aros", default-features = false }
aros-sys = { version = "=0.1.0", path = "../../crates/aros-sys" }

[build-dependencies]
aros-native-build = { version = "=0.2.0", path = "../../tooling/crates/aros-native-build" }
