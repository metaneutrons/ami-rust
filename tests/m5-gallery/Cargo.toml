[package]
name = "ami-rust-m5-gallery"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
autolib = false
license = "MIT OR Apache-2.0"

[[bin]]
name = "ami-rust-m5-gallery"
path = "src/main.rs"

[dependencies]
aros = { version = "=0.1.0", path = "../../crates/aros", features = ["alloc"] }
aros-mui = { version = "=0.1.0", path = "../../crates/aros-mui" }

[workspace]
resolver = "3"
