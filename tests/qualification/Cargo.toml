[package]
name = "ami-rust-qualification"
version.workspace = true
edition.workspace = true
publish = false
autolib = false
autobins = false
license.workspace = true

readme = "README.md"
[[bin]]
name = "ami-rust-qualification"
path = "src/main.rs"

[dependencies]
aros-runtime = { version = "=0.1.0", path = "../../crates/aros-runtime", features = ["alloc"] }
aros-sdk = { version = "=0.1.0", path = "../../crates/aros-sdk" }
aros-sys = { version = "=0.1.0", path = "../../crates/aros-sys" }
aros-alloc = { version = "=0.1.0", path = "../../crates/aros-alloc" }

[build-dependencies]
aros-native-build = { version = "=0.2.0", path = "../../tooling/crates/aros-native-build" }
