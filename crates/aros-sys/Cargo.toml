[package]
name = "aros-sys"
version.workspace = true
edition.workspace = true
publish = ["metaneutrons"]
description = "Raw, allocation-free Rust declarations and vector calls for x86-64 AROS ABI-v1 and ABI-v11."
repository = "https://github.com/metaneutrons/ami-rust"
license-file = "LICENSE"
readme = "README.md"

[lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("aros"))',
    'cfg(target_abi, values("", "abi1", "abi11"))',
] }

[lints.rustdoc]
broken_intra_doc_links = "deny"
