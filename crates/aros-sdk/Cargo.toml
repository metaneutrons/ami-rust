[package]
name = "aros-sdk"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
description = "Task-affine, allocation-free safe wrappers for the bounded AROS M1 SDK"
repository = "https://github.com/metaneutrons/ami-rust"
homepage = "https://github.com/metaneutrons/ami-rust"

readme = "README.md"
[dependencies]
aros-runtime = { version = "=0.1.0", path = "../aros-runtime", default-features = false }
aros-sys = { version = "=0.1.0", path = "../aros-sys", default-features = false }

[features]
default = []
