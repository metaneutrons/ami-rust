[package]
name = "aros"
version.workspace = true
edition.workspace = true
publish = ["metaneutrons"]
description = "Safe no_std application API for the selected AROS ABI profile."
repository = "https://github.com/metaneutrons/ami-rust"
license.workspace = true
readme = "README.md"

[features]
default = ["alloc"]
alloc = []

[dependencies]
aros-sys = { version = "=0.2.0", path = "../aros-sys" }

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
