[workspace]
resolver = "3"
members = ["crates/aros-sys", "crates/aros-alloc", "crates/aros-runtime", "crates/aros-sdk", "crates/public/amiga-sys", "crates/public/amiga-alloc", "crates/public/amiga-os", "examples/minimal", "examples/sha256sum", "tests/qualification", "tests/dependencies"]
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
[profile.release]
opt-level = 2
panic = "abort"
lto = false
codegen-units = 1
incremental = false
debug = 0
strip = "none"
[profile.release.package.compiler_builtins]
codegen-units = 1
