[workspace]
resolver = "3"
members = ["crates/aros", "crates/aros-sys", "crates/aros-mui-sys", "crates/aros-mui", "crates/aros-timer", "crates/aros-graphics", "crates/aros-intuition", "crates/aros-asl", "crates/aros-locale", "examples/minimal", "examples/sha256sum", "tests/qualification", "tests/dependencies"]
exclude = ["examples/mui-hello"]
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
[profile.release]
opt-level = 2
panic = "abort"
lto = false
codegen-units = 1
incremental = false
debug = 0
strip = "none"
[profile.release.package.compiler_builtins]
codegen-units = 1
