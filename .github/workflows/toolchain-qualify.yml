name: Exact toolchain candidate qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SDK version selected by the release proposal
        required: true
        type: string
      rust_version:
        description: Exact rustc version string exposed through rustup metadata
        required: true
        type: string
      cargo_version:
        description: Exact Cargo version string exposed through rustup metadata
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ami-rust-exact-candidate
  cancel-in-progress: false

jobs:
  produce:
    name: Produce ${{ matrix.host.key }}
    if: github.repository == 'metaneutrons/ami-rust' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        host:
          - key: macos-aarch64
            triple: aarch64-apple-darwin
            runner: macos-26
          - key: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - key: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Require protected main and exact host
        env:
          HOST_KEY: ${{ matrix.host.key }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME:$GITHUB_REF_PROTECTED" = workflow_dispatch:true
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          case "$HOST_KEY:$(uname -s):$(uname -m)" in
            macos-aarch64:Darwin:arm64|linux-x86_64:Linux:x86_64|linux-aarch64:Linux:aarch64) ;;
            *) exit 1 ;;
          esac
          test "$(df -Pk "$RUNNER_TEMP" | awk 'END {printf "%.0f\n", $4*1024}')" -ge 25769803776

      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build the pinned maintainer task
        env:
          HOST_TRIPLE: ${{ matrix.host.triple }}
        shell: bash
        run: bash tools/build-maintainer-task.sh "$RUNNER_TEMP/rp3-maintainer" "$HOST_TRIPLE"

      - name: Acquire the immutable contract inputs
        env:
          HOST_KEY: ${{ matrix.host.key }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          acquired="$RUNNER_TEMP/rp3-acquired"
          mkdir -m 700 "$acquired"
          jq -r --arg host "$HOST_KEY" '
            .inputs[] |
            select(.hosts | index($host)) |
            select(.source.url != null) |
            [.role, .source.url, (.bytes|tostring), .sha256] | @tsv
          ' release/rust-production-contract.json |
          while IFS=$'\t' read -r role url bytes digest; do
            case "$role" in *[!a-z0-9_-]*|'') exit 1 ;; esac
            case "$url" in
              https://static.rust-lang.org/*|\
              https://github.com/metaneutrons/ami-rust/releases/download/*|\
              https://github.com/metaneutrons/aros-toolchains/releases/download/*|\
              https://github.com/metaneutrons/aros-tools/releases/download/*) ;;
              *) exit 1 ;;
            esac
            curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location \
              --retry 3 --max-time 600 --max-filesize "$bytes" --output "$acquired/$role" "$url"
            actual_bytes="$(wc -c < "$acquired/$role" | tr -d '[:space:]')"
            if command -v sha256sum >/dev/null; then
              actual_digest="$(sha256sum "$acquired/$role" | awk '{print $1}')"
            else
              actual_digest="$(shasum -a 256 "$acquired/$role" | awk '{print $1}')"
            fi
            if test "$actual_bytes" != "$bytes" || test "$actual_digest" != "$digest"; then
              echo "::error::identity mismatch for $role: expected $bytes/$digest, got $actual_bytes/$actual_digest"
              exit 1
            fi
          done

      - name: Produce the exact unsigned host toolchain
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg repository_root "$GITHUB_WORKSPACE" \
            --arg contract "release/rust-production-contract.json" \
            --arg acquired_inputs "$RUNNER_TEMP/rp3-acquired" \
            --arg work "$RUNNER_TEMP/rp3-producer-work" \
            --arg output "$RUNNER_TEMP/rp3-producer-output" \
            --arg version "$VERSION" \
            '{schema:"ami-rust-toolchain-producer-request-v1",$repository_root,$contract,$acquired_inputs,$work,$output,$version}' \
            > "$RUNNER_TEMP/rp3-producer-request.json"
          "$RUNNER_TEMP/rp3-maintainer/target/release/ami-rust-xtask" \
            toolchain-producer --request "$RUNNER_TEMP/rp3-producer-request.json"

      - name: Retain the exact producer inventory and channel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp3-toolchain-${{ matrix.host.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp3-producer-output/artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble:
    name: Bind the exact three-host candidate
    needs: produce
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build the pinned maintainer task
        shell: bash
        run: bash tools/build-maintainer-task.sh "$RUNNER_TEMP/rp3-assembly-task" x86_64-unknown-linux-gnu

      - name: Download the three exact host artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rp3-toolchain-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp3-downloads

      - name: Assemble the release and package-channel identities
        env:
          VERSION: ${{ inputs.version }}
          RUST_VERSION: ${{ inputs.rust_version }}
          CARGO_VERSION: ${{ inputs.cargo_version }}
        shell: bash
        run: |
          set -euo pipefail
          for host in macos-aarch64 linux-x86_64 linux-aarch64; do
            root="$RUNNER_TEMP/rp3-hosts/$host"
            mkdir -p "$root/artifacts"
            command cp -R "$RUNNER_TEMP/rp3-downloads/rp3-toolchain-$host-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/." "$root/artifacts/"
          done
          tree=$(git rev-parse 'HEAD^{tree}')
          jq -n \
            --arg source_root "$GITHUB_WORKSPACE" \
            --arg contract "release/rust-production-contract.json" \
            --arg version "$VERSION" --arg rust_version "$RUST_VERSION" --arg cargo_version "$CARGO_VERSION" \
            --arg source_commit "$GITHUB_SHA" --arg source_tree "$tree" \
            --argjson qualification_run_id "$GITHUB_RUN_ID" --argjson qualification_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg mac "$RUNNER_TEMP/rp3-hosts/macos-aarch64" \
            --arg x64 "$RUNNER_TEMP/rp3-hosts/linux-x86_64" \
            --arg arm "$RUNNER_TEMP/rp3-hosts/linux-aarch64" \
            --arg output "$RUNNER_TEMP/rp3-assembly" \
            '{schema:"ami-rust-rp3-release-request-v1",$source_root,$contract,$version,$rust_version,$cargo_version,$source_commit,$source_tree,$qualification_run_id,$qualification_run_attempt,host_outputs:{"macos-aarch64":$mac,"linux-x86_64":$x64,"linux-aarch64":$arm},catalog_root:null,catalog_commit:null,$output}' \
            > "$RUNNER_TEMP/rp3-release-request.json"
          "$RUNNER_TEMP/rp3-assembly-task/target/release/ami-rust-xtask" \
            toolchain-release-cutover assemble --request "$RUNNER_TEMP/rp3-release-request.json"

      - name: Retain the exact candidate and reviewable rustup catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp3-assembly/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  qualify:
    name: Install and build on ${{ matrix.host.key }}
    needs: assemble
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        host:
          - key: macos-aarch64
            triple: aarch64-apple-darwin
            runner: macos-26
          - key: linux-x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - key: linux-aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the exact protected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download the exact assembled candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rp3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp4-assembly

      - name: Build the pinned maintainer task
        env:
          HOST_TRIPLE: ${{ matrix.host.triple }}
        shell: bash
        run: bash tools/build-maintainer-task.sh "$RUNNER_TEMP/rp4-maintainer" "$HOST_TRIPLE"

      - name: Prepare an unpublished local rustup catalog
        env:
          HOST_KEY: ${{ matrix.host.key }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rp4-maintainer/target/release/ami-rust-xtask" \
            toolchain-release-cutover prepare-qualification \
            --assembly-root "$RUNNER_TEMP/rp4-assembly" \
            --host "$HOST_KEY" \
            --output "$RUNNER_TEMP/rp4-local-rustup"

      - name: Install with unmodified rustup and observe the common AROS build
        env:
          HOST_KEY: ${{ matrix.host.key }}
          HOST_TRIPLE: ${{ matrix.host.triple }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          umask 022
          toolchain="$VERSION-$HOST_TRIPLE"
          case "$HOST_KEY" in
            macos-aarch64) expected_arch=arm64 ;;
            linux-aarch64) expected_arch=aarch64 ;;
            linux-x86_64) expected_arch=x86_64 ;;
            *) exit 1 ;;
          esac
          actual_arch="$(uname -m)"
          test "$actual_arch" = "$expected_arch" || \
            test "$HOST_KEY:$actual_arch" = linux-aarch64:arm64
          RUSTUP_DIST_SERVER="file://$RUNNER_TEMP/rp4-local-rustup" \
            rustup toolchain install "$toolchain" --profile minimal --no-self-update
          sysroot="$(rustup run "$toolchain" rustc --print sysroot)"
          test -x "$sysroot/bin/aros-link"
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/rp4-vendor" "$RUNNER_TEMP/rp4-result" \
            "$RUNNER_TEMP/rp4-observer-inputs" "$RUNNER_TEMP/rp4-observed" \
            "$RUNNER_TEMP/rp4-observed/home" "$RUNNER_TEMP/rp4-observed/tmp" \
            "$RUNNER_TEMP/rp4-observed/target"
          tar -xJf release/inputs/native-cargo-vendor.tar.xz -C "$RUNNER_TEMP/rp4-vendor"
          vendor="$RUNNER_TEMP/rp4-vendor/vendor"
          bootstrap="$RUNNER_TEMP/rp4-maintainer/bootstrap/toolchain"
          env -i \
            HOME="$RUNNER_TEMP/rp4-maintainer/home" TMPDIR="$RUNNER_TEMP/rp4-maintainer/tmp" \
            PATH="$bootstrap/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            CARGO_HOME="$RUNNER_TEMP/rp4-maintainer/cargo-home" \
            CARGO_TARGET_DIR="$RUNNER_TEMP/rp4-adapter-target" \
            CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true \
            RUSTC="$bootstrap/bin/rustc" RUSTDOC="$bootstrap/bin/rustdoc" \
            LC_ALL=C TZ=UTC \
            "$bootstrap/bin/cargo" build --release --locked --offline \
              --manifest-path tools/consumer-enforcement-adapter/Cargo.toml
          adapter="$RUNNER_TEMP/rp4-adapter-target/release/consumer-enforcement-adapter"
          test -x "$adapter"

          environment='{}'
          case "$HOST_KEY" in
            macos-aarch64)
              host_linker="$(xcrun --find clang)"
              sdkroot="$(cd "$(xcrun --sdk macosx --show-sdk-path)" && pwd -P)"
              environment="$(jq -n --arg sdkroot "$sdkroot" '{SDKROOT:$sdkroot}')"
              ;;
            linux-x86_64|linux-aarch64)
              host_linker="$(readlink -f "$(command -v cc)")"
              ;;
            *) exit 1 ;;
          esac
          config="$RUNNER_TEMP/rp4-observer-inputs/cargo.toml"
          source_date_epoch="$(jq -er '.release_epoch' release/rust-production-contract.json)"
          cat > "$config" <<EOF
          [net]
          offline = true

          [source.crates-io]
          replace-with = "ami-rust-qualification-vendor"

          [source.ami-rust-qualification-vendor]
          directory = "$vendor"

          [unstable]
          ami-rust-reproducible-cross = true

          [build]
          rustc = "$sysroot/bin/rustc"
          jobs = 2
          incremental = false

          [target.x86_64-aros]
          linker = "$sysroot/bin/aros-link"
          rustflags = ["-Zunstable-options", "--remap-path-prefix=$RUNNER_TEMP=/build", "--remap-path-prefix=$GITHUB_WORKSPACE=/ami-rust-source", "--remap-path-prefix=$vendor=/cargo-registry"]

          [target.$HOST_TRIPLE]
          linker = "$host_linker"

          [env]
          SOURCE_DATE_EPOCH = { value = "$source_date_epoch", force = true }
          EOF

          components="$RUNNER_TEMP/rp4-observer-inputs/components.json"
          toolchain_root="$sysroot/libexec/aros/llvm"
          csdk="$sysroot/lib/aros/c-sdk"
          jq -n --arg sysroot "$sysroot" --arg toolchain "$toolchain_root" \
            --arg csdk "$csdk" --arg vendor "$vendor" \
            '{components:{cargo:$sysroot,rust:$sysroot,toolchain:$toolchain,collector:$toolchain,csdk:$csdk,vendor:$vendor}}' \
            > "$components"
          sha256() { shasum -a 256 "$1" | awk '{print $1}'; }
          executables="$(jq -n \
            --arg linker "$sysroot/bin/aros-link" \
            --arg collector "$toolchain_root/bin/collect-aros-sdk" \
            --arg lld "$toolchain_root/bin/ld.lld" \
            --arg strip "$toolchain_root/bin/llvm-strip" \
            '[$linker,$collector,$lld,$strip]')"
          spec="$RUNNER_TEMP/rp4-observer-inputs/spec.json"
          jq -n --arg cargo "$sysroot/bin/cargo" --arg config "$config" \
            --arg source "$GITHUB_WORKSPACE" --arg managed "$RUNNER_TEMP/rp4-observed" \
            --arg home "$RUNNER_TEMP/rp4-observed/home" \
            --arg tmp "$RUNNER_TEMP/rp4-observed/tmp" \
            --arg target "$RUNNER_TEMP/rp4-observed/target" \
            --arg components "$components" --arg config_sha "$(sha256 "$config")" \
            --arg components_sha "$(sha256 "$components")" \
            --arg lock "$GITHUB_WORKSPACE/Cargo.lock" --arg lock_sha "$(sha256 Cargo.lock)" \
            --arg contract "$GITHUB_WORKSPACE/release/rust-production-contract.json" \
            --arg contract_sha "$(sha256 release/rust-production-contract.json)" \
            --arg vendor_archive "$GITHUB_WORKSPACE/release/inputs/native-cargo-vendor.tar.xz" \
            --arg vendor_sha "$(sha256 release/inputs/native-cargo-vendor.tar.xz)" \
            --argjson environment "$environment" --argjson executables "$executables" \
            '{schema:"ami-rust-consumer-observation-spec-v1",phase:"build",environment:$environment,command:[$cargo,"--config",$config,"build","--manifest-path",($source+"/Cargo.toml"),"--package","ami-rust-sha256sum","--bin","ami-rust-sha256sum","--target","x86_64-aros","--release","--locked","--offline","--target-dir",$target],expected_exit:0,cwd:$source,home:$home,tmp:$tmp,read_trees:[{role:"source",path:$source}],write_trees:[{role:"work",path:$managed}],read_files:[],read_directories:[],executables:$executables,libraries:[],deny_exec:[],deny_library:[],component_record:$components,derived:{role:"consumer-build-parent",path:$target},bindings:[{path:$config,sha256:$config_sha},{path:$components,sha256:$components_sha},{path:$lock,sha256:$lock_sha},{path:$contract,sha256:$contract_sha},{path:$vendor_archive,sha256:$vendor_sha}]}' \
            > "$spec"
          observer="$RUNNER_TEMP/rp4-maintainer/target/release/ami-rust-xtask"
          "$observer" native-consumer-observe --spec "$spec" --adapter "$adapter" \
            --output "$RUNNER_TEMP/rp4-result/build-observation"
          observation="$RUNNER_TEMP/rp4-result/build-observation/observation.json"
          jq -e \
            '.status == "PASS_EXPECTED_CONSUMER_RESULT_AND_ADAPTER_EVIDENCE" and
             .phase == "build" and .expected_exit == 0 and
             .adapter_evidence.child_exit_code == 0 and
             .adapter_evidence.network_outbound_allowed == false' \
            "$observation" >/dev/null

          elf="$RUNNER_TEMP/rp4-observed/target/x86_64-aros/release/ami-rust-sha256sum"
          test -s "$elf"
          command cp "$elf" "$RUNNER_TEMP/rp4-result/ami-rust-sha256sum"
          rustup run "$toolchain" rustc -Vv > "$RUNNER_TEMP/rp4-result/rustc.txt"
          rustup run "$toolchain" cargo -Vv > "$RUNNER_TEMP/rp4-result/cargo.txt"
          rustup --version > "$RUNNER_TEMP/rp4-result/rustup.txt"
          elf_sha="$(shasum -a 256 "$elf" | awk '{print $1}')"
          elf_bytes="$(wc -c < "$elf" | tr -d '[:space:]')"
          catalog_sha="$(shasum -a 256 "$RUNNER_TEMP/rp4-local-rustup/dist/channel-rust-$VERSION.toml" | awk '{print $1}')"
          jq -n --arg host "$HOST_KEY" --arg triple "$HOST_TRIPLE" \
            --arg source_commit "$GITHUB_SHA" --arg version "$VERSION" \
            --arg elf_sha256 "$elf_sha" --argjson elf_bytes "$elf_bytes" \
            --arg catalog_sha256 "$catalog_sha" \
            --arg observer_sha256 "$(sha256 "$observer")" \
            --arg adapter_sha256 "$(sha256 "$adapter")" \
            --arg observation_sha256 "$(sha256 "$observation")" \
            --rawfile rustc "$RUNNER_TEMP/rp4-result/rustc.txt" \
            --rawfile cargo "$RUNNER_TEMP/rp4-result/cargo.txt" \
            --rawfile rustup "$RUNNER_TEMP/rp4-result/rustup.txt" \
            '{schema:"ami-rust-rc5-host-qualification-v1",status:"PASS",$host,$triple,$source_commit,$version,installation:{client:"unmodified rustup",catalog_sha256:$catalog_sha256},application:{package:"ami-rust-sha256sum",target:"x86_64-aros",bytes:$elf_bytes,sha256:$elf_sha256},build_observation:{status:"PASS_EXACT_CARGO_BUILD",observer_sha256:$observer_sha256,adapter_sha256:$adapter_sha256,observation_sha256:$observation_sha256,network_outbound:false},versions:{rustc:$rustc,cargo:$cargo,rustup:$rustup},publication_authorized:false}' \
            > "$RUNNER_TEMP/rp4-result/host-qualification.json"

      - name: Retain host qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp4-qualified-${{ matrix.host.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp4-result/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  admit:
    name: Admit exact three-host candidate
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download three host qualification records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rp4-qualified-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp4-qualified

      - name: Download the exact assembled candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rp3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp4-assembly

      - name: Require one application identity and the complete target-payload join
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t records < <(find "$RUNNER_TEMP/rp4-qualified" -name host-qualification.json -type f | sort)
          test "${#records[@]}" = 3
          jq -s -e '
            select(
              (map(.host) | sort) == ["linux-aarch64","linux-x86_64","macos-aarch64"] and
              all(.[];
                .schema == "ami-rust-rc5-host-qualification-v1" and
                .status == "PASS" and .installation.client == "unmodified rustup" and
                .build_observation.status == "PASS_EXACT_CARGO_BUILD" and
                .build_observation.network_outbound == false and
                (.build_observation.observer_sha256 | test("^[0-9a-f]{64}$")) and
                (.build_observation.adapter_sha256 | test("^[0-9a-f]{64}$")) and
                (.build_observation.observation_sha256 | test("^[0-9a-f]{64}$"))
              ) and
              ([.[].application.sha256] | unique | length) == 1 and
              ([.[].application.bytes] | unique | length) == 1
            )
          ' "${records[@]}" > "$RUNNER_TEMP/rp4-hosts.json"
          target_payload="$(jq -cer '
            .three_host_target_payload as $payload |
            select($payload.invariant_file_count > 0) |
            select($payload.target_libraries.libraries_per_host == 3) |
            select($payload.target_libraries.native_object_and_symbol_index_records_equal == true) |
            select($payload.target_libraries.compiler_outputs_mutated == false) |
            select($payload.host_metadata_mutated == false) |
            {
              hosts: 3,
              invariant_files: $payload.invariant_file_count,
              target_libraries_per_host: $payload.target_libraries.libraries_per_host,
              comparison: $payload.comparison,
              host_metadata_mutated: $payload.host_metadata_mutated
            }
          ' "$RUNNER_TEMP/rp4-assembly/candidate/publication-inventory.json")"
          app_sha="$(jq -r '.[0].application.sha256' "$RUNNER_TEMP/rp4-hosts.json")"
          app_bytes="$(jq -r '.[0].application.bytes' "$RUNNER_TEMP/rp4-hosts.json")"
          mkdir -m 700 "$RUNNER_TEMP/rp4-admission"
          jq -n --arg version "$VERSION" --arg source_commit "$GITHUB_SHA" \
            --arg app_sha256 "$app_sha" --argjson app_bytes "$app_bytes" \
            --argjson target_payload "$target_payload" \
            --slurpfile hosts "$RUNNER_TEMP/rp4-hosts.json" \
            '{schema:"ami-rust-rc5-three-host-admission-v1",status:"PASS",$version,$source_commit,hosts:$hosts[0],application:{target:"x86_64-aros",bytes:$app_bytes,sha256:$app_sha256},build_observation:{status:"PASS_EXACT_CARGO_BUILD_ON_THREE_HOSTS"},$target_payload,publication_authorized:false}' \
            > "$RUNNER_TEMP/rp4-admission/three-host-admission.json"
          command cp "${records[1]%/*}/ami-rust-sha256sum" "$RUNNER_TEMP/rp4-admission/ami-rust-sha256sum"
          test "$(shasum -a 256 "$RUNNER_TEMP/rp4-admission/ami-rust-sha256sum" | awk '{print $1}')" = "$app_sha"

      - name: Retain the admitted application and three-host evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rp4-three-host-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rp4-admission/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
