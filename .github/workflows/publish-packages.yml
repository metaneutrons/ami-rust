name: Publish qualified package channels

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Successful package qualification or sealed-candidate requalification run ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ami-rust-protected-builds
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver the qualified formula and shared archive import
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 110
    permissions:
      contents: write
      attestations: read
      actions: read
    outputs:
      commit: ${{ steps.producer.outputs.commit }}
      tree: ${{ steps.producer.outputs.tree }}
      epoch: ${{ steps.producer.outputs.epoch }}
      attempt: ${{ steps.producer.outputs.attempt }}
      candidate_run_id: ${{ steps.producer.outputs.run_id }}
      candidate_sha256: ${{ steps.producer.outputs.candidate_sha256 }}
    steps:
      - name: Require protected main
        env:
          PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$GITHUB_REPOSITORY" = metaneutrons/ami-rust
          test "$GITHUB_REF" = refs/heads/main
          test "$PROTECTED" = true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all gates from the exact successful producer
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run_id }}
        run: python3 -I -B packaging/control.py producer --producer-run-id "$PRODUCER_RUN" --receipt "$RUNNER_TEMP/producer.json"
      - name: Verify the same public candidate independently
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.producer.outputs.commit }}
          CANDIDATE_SHA256: ${{ steps.producer.outputs.candidate_sha256 }}
          TREE: ${{ steps.producer.outputs.tree }}
          EPOCH: ${{ steps.producer.outputs.epoch }}
          ATTEMPT: ${{ steps.producer.outputs.attempt }}
          PRODUCER_RUN: ${{ steps.producer.outputs.run_id }}
        run: |
          python3 -I -B packaging/auth.py bootstrap --tools "$RUNNER_TEMP/package-tools"
          tag=$(python3 -c 'import json; print(json.load(open("packaging/pins.json"))["packaging_tag"])')
          "$RUNNER_TEMP/package-tools/gh" release download "$tag" --repo metaneutrons/ami-rust --dir "$RUNNER_TEMP/package-candidate"
          python3 -I -B - <<'PY'
          import hashlib, os, pathlib
          wanted = os.environ.get('CANDIDATE_SHA256')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'package-candidate/candidate.json'
          if wanted and hashlib.sha256(path.read_bytes()).hexdigest() != wanted:
              raise SystemExit('Published candidate differs from qualified sealed inventory')
          PY
          python3 -I -B packaging/candidate.py verify --pins packaging/pins.json --directory "$RUNNER_TEMP/package-candidate" --source-commit "$COMMIT" --source-tree "$TREE" --run-id "$PRODUCER_RUN" --run-attempt "$ATTEMPT" --epoch "$EPOCH"
          python3 -I -B packaging/auth.py verify --directory "$RUNNER_TEMP/package-candidate" --tools "$RUNNER_TEMP/package-tools" --source-commit "$COMMIT"
          ruby -c "$RUNNER_TEMP/package-candidate/ami-rust.rb"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: archive-preflight
        with:
          client-id: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: apt-archive
          permission-actions: write
          permission-contents: read
      - name: Revalidate archive access before any channel mutation
        env:
          GH_TOKEN: ${{ steps.archive-preflight.outputs.token }}
        run: |
          gh api installation/repositories --jq '[.total_count, [.repositories[].full_name]] == [1, ["metaneutrons/apt-archive"]]' | grep -qx true
          gh api repos/metaneutrons/apt-archive/actions/workflows/publish.yml --jq .state | grep -qx active
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: tap
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-administration: read
      - name: Open the attested formula pull request
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
        run: python3 -I -B packaging/publish_tap.py open --formula "$RUNNER_TEMP/package-candidate/ami-rust.rb" --receipt "$RUNNER_TEMP/tap-open.json"
      - name: Wait for the required tap qualification on the measured head
        env:
          GH_TOKEN: ${{ steps.tap.outputs.token }}
        run: |
          python3 -I -B - <<'PY'
          import importlib.util, json, os, pathlib, time
          spec = importlib.util.spec_from_file_location('tap_wait', 'packaging/publish_tap.py')
          tap = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tap)
          opened = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'tap-open.json').read_text())
          if opened['status'] == 'ALREADY_DELIVERED':
              raise SystemExit(0)
          head = opened['head_sha']
          deadline, delay = time.monotonic() + 2700, 60
          while True:
              response = tap.api(f'repos/{tap.TAP_REPOSITORY}/commits/{head}/check-runs?filter=latest&per_page=100')
              if response['total_count'] != len(response['check_runs']):
                  raise SystemExit('Tap check response is incomplete')
              selected = [row for row in response['check_runs'] if row['name'] == 'Formula qualification']
              if len(selected) > 1:
                  raise SystemExit('Required tap check is ambiguous')
              if selected and selected[0]['status'] == 'completed':
                  if selected[0]['conclusion'] != 'success':
                      raise SystemExit('Required tap qualification failed')
                  break
              if time.monotonic() + delay > deadline:
                  raise SystemExit('Tap qualification did not finish within 45 minutes')
              time.sleep(delay)
              delay = min(delay * 2, 300)
          PY
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: merge
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read
          permission-administration: read
      - name: Recheck protection and qualified head, merge and read back
        env:
          GH_TOKEN: ${{ steps.merge.outputs.token }}
        run: |
          status=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/tap-open.json"))["status"])')
          if test "$status" = OPEN_PULL_REQUEST; then
            python3 -I -B packaging/publish_tap.py merge --formula "$RUNNER_TEMP/package-candidate/ami-rust.rb" --open-receipt "$RUNNER_TEMP/tap-open.json" --receipt "$RUNNER_TEMP/tap-merge.json"
          elif test "$status" != ALREADY_DELIVERED; then
            exit 1
          fi
      - name: Promote the unchanged packaging release without replacing latest SDK
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN: ${{ inputs.producer_run_id }}
        run: python3 -I -B packaging/control.py stable --producer-run-id "$PRODUCER_RUN" --directory "$RUNNER_TEMP/package-candidate" --receipt "$RUNNER_TEMP/stable-package.json"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: archive
        with:
          client-id: ${{ vars.ARCHIVE_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.ARCHIVE_DISPATCH_PRIVATE_KEY }}
          owner: metaneutrons
          repositories: apt-archive
          permission-actions: write
          permission-contents: read
      - name: Dispatch and require the exact shared archive publication
        env:
          GH_TOKEN: ${{ steps.archive.outputs.token }}
        run: python3 -I -B packaging/control.py dispatch-archive --receipt "$RUNNER_TEMP/archive-dispatch.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-channel-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/producer.json
            ${{ runner.temp }}/tap-open.json
            ${{ runner.temp }}/tap-merge.json
            ${{ runner.temp }}/stable-package.json
            ${{ runner.temp }}/archive-dispatch.json
          if-no-files-found: error
          retention-days: 30

  consumer:
    name: Public channel client (${{ matrix.channel }})
    needs: deliver
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            channel: apt
          - os: macos-26
            channel: homebrew
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the exact published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.deliver.outputs.commit }}
          CANDIDATE_SHA256: ${{ needs.deliver.outputs.candidate_sha256 }}
          TREE: ${{ needs.deliver.outputs.tree }}
          EPOCH: ${{ needs.deliver.outputs.epoch }}
          ATTEMPT: ${{ needs.deliver.outputs.attempt }}
          PRODUCER_RUN: ${{ needs.deliver.outputs.candidate_run_id }}
        run: |
          python3 -I -B packaging/auth.py bootstrap --tools "$RUNNER_TEMP/package-tools"
          tag=$(python3 -c 'import json; print(json.load(open("packaging/pins.json"))["packaging_tag"])')
          "$RUNNER_TEMP/package-tools/gh" release download "$tag" --repo metaneutrons/ami-rust --dir "$RUNNER_TEMP/package-candidate"
          python3 -I -B - <<'PY'
          import hashlib, os, pathlib
          wanted = os.environ.get('CANDIDATE_SHA256')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'package-candidate/candidate.json'
          if wanted and hashlib.sha256(path.read_bytes()).hexdigest() != wanted:
              raise SystemExit('Published candidate differs from qualified sealed inventory')
          PY
          python3 -I -B packaging/candidate.py verify --pins packaging/pins.json --directory "$RUNNER_TEMP/package-candidate" --source-commit "$COMMIT" --source-tree "$TREE" --run-id "$PRODUCER_RUN" --run-attempt "$ATTEMPT" --epoch "$EPOCH"
          python3 -I -B packaging/auth.py verify --directory "$RUNNER_TEMP/package-candidate" --tools "$RUNNER_TEMP/package-tools" --source-commit "$COMMIT"
      - name: Execute the actual published channel instructions and build
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ matrix.channel }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: python3 -I -B packaging/public_consumer.py --channel "$CHANNEL" --packages-dir "$RUNNER_TEMP/package-candidate" --root "$RUNNER_TEMP/public-client"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-channel-client-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-client/*.json
            ${{ runner.temp }}/public-client/*.log
            ${{ runner.temp }}/public-client/*.sh
            ${{ runner.temp }}/public-client/original-sdk-receipts/
            ${{ runner.temp }}/public-client/archive-verification/
            ${{ runner.temp }}/public-client/consumer/evidence-*/
            ${{ runner.temp }}/public-client/consumer/persistent.json
          if-no-files-found: error
          retention-days: 30

  acceptance:
    name: Public package channel acceptance
    if: always()
    needs: [deliver, consumer]
    runs-on: ubuntu-24.04
    steps:
      - name: Require publication and both real public clients
        env:
          DELIVER: ${{ needs.deliver.result }}
          CONSUMER: ${{ needs.consumer.result }}
        run: |
          test "$DELIVER" = success
          test "$CONSUMER" = success
