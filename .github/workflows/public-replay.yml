# The former CLI pipeline is preserved in immutable Git/release history.
# Replacement toolchain/crate production requires migration RC2/RC3 qualification.
name: Public consumer replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-cli-pipeline:
    name: Retired CLI pipeline — replacement required
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete CLI production or replay
        run: |
          echo 'The public ami-rust/cargo-ami CLI and its production pipeline were retired.' >&2
          echo 'Use the existing immutable release for historical replay.' >&2
          echo 'New toolchain/crate release gates remain open in issues #72 and #73.' >&2
          exit 1
