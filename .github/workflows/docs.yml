name: Documentation

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aros/**'
      - 'crates/aros-sys/**'
      - 'crates/aros-mui/**'
      - 'crates/aros-mui-sys/**'
      - 'README.md'
      - 'tools/build-public-rustdoc.sh'
      - 'tools/build-maintainer-task.sh'
      - 'tools/bootstrap-host-rust.sh'
      - 'release/native-cargo-vendor-inputs.json'
      - 'release/maintainer-rust-bootstrap-inputs.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aros/**'
      - 'crates/aros-sys/**'
      - 'crates/aros-mui/**'
      - 'crates/aros-mui-sys/**'
      - 'README.md'
      - 'tools/build-public-rustdoc.sh'
      - 'tools/build-maintainer-task.sh'
      - 'tools/bootstrap-host-rust.sh'
      - 'release/native-cargo-vendor-inputs.json'
      - 'release/maintainer-rust-bootstrap-inputs.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check documentation site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Generate public Rust API reference
        run: bash tools/build-public-rustdoc.sh "$RUNNER_TEMP/ami-rust-public-rustdoc" x86_64-unknown-linux-gnu

      - name: Build site
        run: pnpm --dir website run build

      - name: Add public Rust API reference to site
        run: |
          mkdir -p website/dist/rustdoc
          cp -a "$RUNNER_TEMP/ami-rust-public-rustdoc/public-rustdoc/doc/." website/dist/rustdoc/
          test -f website/dist/rustdoc/aros/index.html
          test -f website/dist/rustdoc/aros_mui/index.html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Generate public Rust API reference
        run: bash tools/build-public-rustdoc.sh "$RUNNER_TEMP/ami-rust-public-rustdoc" x86_64-unknown-linux-gnu

      - name: Build site
        run: pnpm --dir website run build

      - name: Add public Rust API reference to site
        run: |
          mkdir -p website/dist/rustdoc
          cp -a "$RUNNER_TEMP/ami-rust-public-rustdoc/public-rustdoc/doc/." website/dist/rustdoc/
          test -f website/dist/rustdoc/aros/index.html
          test -f website/dist/rustdoc/aros_mui/index.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
