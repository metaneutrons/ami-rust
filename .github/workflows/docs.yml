name: Documentation

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - '!docs/evidence/**'
      - '!docs/m1-qualification.md'
      - '!docs/m2-mui-api-model.md'
      - '!docs/m3-qualification.md'
      - '!docs/m4-qualification.md'
      - '!docs/m5-qualification.md'
      - '!docs/m6-qualification.md'
      - '!docs/m7-qualification.md'
      - '!docs/mui-hello-qualification.md'
      - '!docs/mui-safe-api.md'
      - '!docs/plans/**'
      - 'assets/**'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aros/**'
      - 'crates/aros-mui/**'
      - 'crates/aros-sys/**'
      - 'crates/aros-mui-sys/**'
      - 'release/maintainer-rust-bootstrap-inputs.json'
      - 'tools/bootstrap-host-rust.sh'
      - 'tools/generate-astro-api.sh'
      - 'tools/check-doc-examples.mjs'
      - 'tooling/crates/xtask/src/mui_safe_codegen.rs'
      - 'bindings/mui/**'
      - 'version.txt'
      - 'CHANGELOG.md'
      - '_typos.toml'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '!docs/evidence/**'
      - '!docs/m1-qualification.md'
      - '!docs/m2-mui-api-model.md'
      - '!docs/m3-qualification.md'
      - '!docs/m4-qualification.md'
      - '!docs/m5-qualification.md'
      - '!docs/m6-qualification.md'
      - '!docs/m7-qualification.md'
      - '!docs/mui-hello-qualification.md'
      - '!docs/mui-safe-api.md'
      - '!docs/plans/**'
      - 'assets/**'
      - 'README.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aros/**'
      - 'crates/aros-mui/**'
      - 'crates/aros-sys/**'
      - 'crates/aros-mui-sys/**'
      - 'release/maintainer-rust-bootstrap-inputs.json'
      - 'tools/bootstrap-host-rust.sh'
      - 'tools/generate-astro-api.sh'
      - 'tools/check-doc-examples.mjs'
      - 'tooling/crates/xtask/src/mui_safe_codegen.rs'
      - 'bindings/mui/**'
      - 'version.txt'
      - 'CHANGELOG.md'
      - '_typos.toml'
      - '.github/workflows/docs.yml'
  # A release's documentation is built from its tag, which the protected release
  # workflow creates. Publish once that workflow has finished. This runs on the
  # default branch, which is where the github-pages environment deploys from.
  workflow_run:
    workflows: ['Protected toolchain release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check documentation site
    # After a release workflow, only a successful one publishes documentation.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags are needed to verify the pinned release revision in the docs.
          fetch-depth: 0

      - name: Check spelling
        uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0
        with:
          files: docs website/scripts website/src website/astro.config.mjs tools crates/aros/src crates/aros-mui/src

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Test version discovery
        run: pnpm --dir website run test

      - name: Generate Rust API reference
        run: >-
          bash tools/generate-astro-api.sh
          "$RUNNER_TEMP/ami-rust-astro-api-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          "$GITHUB_WORKSPACE/docs/reference"
          x86_64-unknown-linux-gnu

      - name: Build site
        run: pnpm --dir website run build

      - name: Check links, headings, metadata and content rules
        run: pnpm --dir website run check

      - name: Check accessibility
        run: pnpm --dir website run a11y

      - name: Check mobile layout
        run: pnpm --dir website run mobile

  assemble:
    name: Assemble all documentation versions
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every version is built from its own git ref.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Build every version
        run: >-
          node website/scripts/assemble-site.mjs
          --out "$RUNNER_TEMP/site"
          --host x86_64-unknown-linux-gnu

      - name: Check the assembled site
        run: node website/scripts/check-assembled.mjs "$RUNNER_TEMP/site"

      - name: Upload site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: ${{ runner.temp }}/site
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: assemble
    # One deployment at a time; never cancel one that is running.
    concurrency:
      group: documentation-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
