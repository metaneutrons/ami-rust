name: Hosted SDK candidate producer

on:
  workflow_dispatch:
    inputs:
      reference_proposal:
        description: Collect new native references for guest qualification; skip authentication
        type: boolean
        default: false
      native_tooling:
        description: Build and authenticate the native Rust SDK generation
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ami-rust-protected-builds
  cancel-in-progress: false

jobs:
  admission:
    name: Admit complete workflow artifact retention
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require protected main and the designated repository
        shell: bash
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$GITHUB_REPOSITORY" = metaneutrons/ami-rust
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_IS_PROTECTED" = true
      - name: Reject native tooling reference proposals
        env:
          NATIVE_TOOLING: ${{ inputs.native_tooling }}
          REFERENCE_PROPOSAL: ${{ inputs.reference_proposal }}
        shell: bash
        run: |
          if [ "$NATIVE_TOOLING" = true ] && [ "$REFERENCE_PROPOSAL" = true ]; then
            echo "Native tooling and reference proposal modes cannot be combined" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit aggregate CI artifact retention once before either producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          REFERENCE_PROPOSAL: ${{ inputs.reference_proposal }}
          NATIVE_TOOLING: ${{ inputs.native_tooling }}
        shell: bash
        run: |
          proposal_args=()
          if [ "$REFERENCE_PROPOSAL" = true ]; then
            proposal_args+=(--reference-proposal)
          fi
          native_args=()
          if [ "$NATIVE_TOOLING" = true ]; then
            native_args+=(--native-tooling)
          fi
          python3 -I -B release/ci_artifact_admission.py --sdk-candidate "${proposal_args[@]}" "${native_args[@]}"
      - name: Prepare non-SDK provenance ingestion probe
        id: provenance-probe
        if: ${{ !inputs.reference_proposal }}
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          python3 -I -B release/ci_auth.py preflight \
            --source "$GITHUB_WORKSPACE" \
            --subject "$RUNNER_TEMP/ami-rust-github-provenance-probe.txt" \
            --predicate "$RUNNER_TEMP/ami-rust-github-provenance-probe.json"
      - name: Ingest non-SDK provenance probe before producer jobs
        id: attest-provenance-probe
        if: ${{ !inputs.reference_proposal }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ami-rust-github-provenance-probe.txt
          subject-digest: sha256:${{ steps.provenance-probe.outputs.subject_sha256 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-github-provenance-probe.json
      - name: Require persisted admission provenance proof
        if: ${{ !inputs.reference_proposal }}
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BUNDLE_PATH: ${{ steps.attest-provenance-probe.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest-provenance-probe.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest-provenance-probe.outputs.attestation-url }}
          EXPECTED_SUBJECT_SHA256: ${{ steps.provenance-probe.outputs.subject_sha256 }}
          EXPECTED_PREDICATE_SHA256: ${{ steps.provenance-probe.outputs.predicate_sha256 }}
        shell: bash
        run: |
          python3 -I -B release/ci_auth.py verify-preflight \
            --source "$GITHUB_WORKSPACE" \
            --subject "$RUNNER_TEMP/ami-rust-github-provenance-probe.txt" \
            --predicate "$RUNNER_TEMP/ami-rust-github-provenance-probe.json" \
            --bundle "$BUNDLE_PATH" \
            --attestation-id "$ATTESTATION_ID" \
            --attestation-url "$ATTESTATION_URL" \
            --expected-subject-sha256 "$EXPECTED_SUBJECT_SHA256" \
            --expected-predicate-sha256 "$EXPECTED_PREDICATE_SHA256"

  producer:
    if: ${{ !inputs.native_tooling }}
    needs: admission
    name: SDK producer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-26
            profile: macos-aarch64
          - os: ubuntu-24.04
            profile: linux-x86_64
    steps:
      - name: Require protected main and the designated repository
        shell: bash
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$GITHUB_REPOSITORY" = metaneutrons/ami-rust
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_IS_PROTECTED" = true
      - name: Check out the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned standalone Python runtime
        id: python-runtime
        shell: bash
        run: |
          python3 -I -B release/ci_python.py \
            --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            --inputs release/ci-python-inputs.json
      - name: Produce host SDK candidate and native evidence
        id: producer
        shell: bash
        env:
          REFERENCE_PROPOSAL: ${{ inputs.reference_proposal }}
        run: |
          proposal_args=()
          if [ "$REFERENCE_PROPOSAL" = true ]; then
            proposal_args+=(--reference-proposal)
          fi
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_sdk.py \
            --work "$RUNNER_TEMP/ami-rust-sdk-work" \
            --output "$RUNNER_TEMP/ami-rust-sdk-output" \
            --inputs release/ci-sdk-inputs.json \
            --cargo-inputs release/ci-bootstrap-inputs.json \
            --resources release/ci-resources.json \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            "${proposal_args[@]}"
      - name: Retire managed work and validate bounded candidate payloads
        id: cleanup
        if: always()
        shell: bash
        env:
          PRODUCER_RESULT: ${{ steps.producer.outcome }}
          PYTHON_RESULT: ${{ steps.python-runtime.outcome }}
          EXPECTED_HOST: ${{ matrix.profile }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REFERENCE_PROPOSAL: ${{ inputs.reference_proposal }}
        run: |
          python3 -I -B - <<'PYCODE'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat

          temporary = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          work = temporary / "ami-rust-sdk-work"
          python_root = temporary / "ami-rust-python-bootstrap"
          output = temporary / "ami-rust-sdk-output"
          for root in (work, python_root, output):
              if root.is_symlink():
                  raise SystemExit("Managed SDK roots must not be symlinks")
          output.mkdir(mode=0o700, exist_ok=True)

          bootstrap = python_root / "bootstrap.json"
          if bootstrap.exists():
              if bootstrap.is_symlink() or not bootstrap.is_file() or bootstrap.stat().st_size > 65536:
                  raise SystemExit("Invalid pinned Python bootstrap receipt")
              (output / "python-bootstrap.json").write_bytes(bootstrap.read_bytes())
          if python_root.exists():
              shutil.rmtree(python_root)
          if python_root.exists():
              raise SystemExit("Pinned Python runtime was not retired")

          def pairs(items):
              result = {}
              for key, value in items:
                  if key in result:
                      raise ValueError("Duplicate JSON key")
                  result[key] = value
              return result

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          def read_json(path):
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 8 * 1024 * 1024:
                  raise ValueError("Missing, linked or oversized metadata: " + path.name)
              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=pairs,
                                parse_constant=lambda token: (_ for _ in ()).throw(ValueError("Non-finite JSON")))

          def regular(path):
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode):
                  raise ValueError("Candidate payload must be a regular file: " + str(path))
              return info

          def safe_relative(value):
              if not isinstance(value, str) or not value or "\\" in value or "\0" in value or ":" in value:
                  raise ValueError("Diagnostic path is not a portable relative path")
              path = PurePosixPath(value)
              if path.is_absolute() or path.as_posix() != value or any(part in ("", ".", "..") for part in value.split("/")):
                  raise ValueError("Unsafe diagnostic path")
              return path

          def validate_cold_root_diagnostics(source):
              if source.is_symlink() or not source.is_dir():
                  raise ValueError("Cold-root diagnostics root must be a real directory")
              report_path = source / "report.json"
              report = read_json(report_path)
              if (report.get("schema") != "ami-rust-cold-root-diagnostics-v1"
                      or report.get("status") != "COLD_ROOT_NATIVE_MISMATCH"
                      or report.get("variant") not in {"minimal-noalloc", "minimal-alloc", "qualification", "dependencies", "sha256sum"}
                      or report.get("first_layout") != "sdk-layout-a"
                      or report.get("second_layout") != "sdk-layout-b"):
                  raise ValueError("Unrecognized cold-root diagnostics report")

              def canonical_map(value):
                  if not isinstance(value, dict) or not value or len(value) > 128 or "AMIRUST" not in value:
                      raise ValueError("Cold-root canonical map is malformed")
                  for member, row in value.items():
                      safe_relative(member)
                      if (not isinstance(row, dict) or set(row) != {"bytes", "sha256"}
                              or type(row["bytes"]) is not int or row["bytes"] < 0
                              or not isinstance(row["sha256"], str)
                              or len(row["sha256"]) != 64
                              or any(character not in "0123456789abcdef" for character in row["sha256"])):
                          raise ValueError("Cold-root canonical member row is malformed")
                  return value

              first_map = canonical_map(report.get("first_canonical_artifacts"))
              second_map = canonical_map(report.get("second_canonical_artifacts"))
              expected_members = sorted(member for member in set(first_map) | set(second_map)
                                        if first_map.get(member) != second_map.get(member))
              rows = report.get("differing_members")
              if (not isinstance(rows, list) or [row.get("member") for row in rows if isinstance(row, dict)] != expected_members
                      or len(rows) != len(expected_members)):
                  raise ValueError("Cold-root differing-member inventory is incomplete")
              raw_paths = set()
              retained_bytes = 0
              omitted_bytes = 0
              for member_row in rows:
                  member = member_row["member"]
                  for side, canonical in (("first", first_map), ("second", second_map)):
                      state = member_row.get(side)
                      expected = canonical.get(member)
                      if not isinstance(state, dict):
                          raise ValueError("Cold-root member evidence is malformed")
                      if expected is None:
                          if (state.get("present") is not False or state.get("retained") is not False
                                  or not isinstance(state.get("omitted_reason"), str)):
                              raise ValueError("Absent cold-root member has invalid evidence state")
                          continue
                      if (state.get("present") is not True or state.get("bytes") != expected["bytes"]
                              or state.get("sha256") != expected["sha256"]
                              or type(state.get("retained")) is not bool):
                          raise ValueError("Cold-root raw evidence differs from its canonical map")
                      if state["retained"]:
                          relative = safe_relative(state.get("path"))
                          if relative.parts[0] != "raw" or relative.as_posix() in raw_paths:
                              raise ValueError("Cold-root raw evidence path is invalid or duplicated")
                          target = source.joinpath(*relative.parts)
                          info = regular(target)
                          if info.st_size != expected["bytes"] or sha256(target) != expected["sha256"]:
                              raise ValueError("Retained cold-root bytes fail their canonical identity")
                          raw_paths.add(relative.as_posix())
                          retained_bytes += info.st_size
                      else:
                          if not isinstance(state.get("omitted_reason"), str) or not state["omitted_reason"]:
                              raise ValueError("Omitted cold-root bytes lack a reason")
                          omitted_bytes += expected["bytes"]
              if (report.get("raw_retained_bytes") != retained_bytes
                      or report.get("raw_omitted_bytes") != omitted_bytes
                      or report.get("raw_retention_limit_bytes") != 24 * 1024 * 1024
                      or retained_bytes > 24 * 1024 * 1024
                      or report.get("host_artifact_retention_limit_bytes") != 32 * 1024 * 1024):
                  raise ValueError("Cold-root evidence byte accounting is inconsistent")

              observed = set()
              for path in source.rglob("*"):
                  info = path.lstat()
                  if stat.S_ISDIR(info.st_mode):
                      if path.relative_to(source).as_posix() != "raw":
                          raise ValueError("Unexpected cold-root diagnostics directory")
                      continue
                  relative = path.relative_to(source).as_posix()
                  if not stat.S_ISREG(info.st_mode) or relative not in {"report.json", *raw_paths}:
                      raise ValueError("Unexpected or linked cold-root diagnostics file")
                  observed.add(relative)
              if observed != {"report.json", *raw_paths}:
                  raise ValueError("Cold-root diagnostics inventory is incomplete")
              return report, raw_paths

          def retain_cold_root_diagnostics(source, output):
              report, raw_paths = validate_cold_root_diagnostics(source)
              destination = output / "cold-root-diagnostics"
              if destination.exists() or destination.is_symlink():
                  raise ValueError("Cold-root diagnostics destination is not fresh")
              (destination / "raw").mkdir(parents=True)
              base_bytes = sum(path.stat().st_size for path in output.rglob("*")
                               if path.is_file() and not path.is_symlink())
              source_report = source / "report.json"
              report_value = report
              report_size = source_report.stat().st_size
              reserve = 64 * 1024
              raw_budget = max(0, 32 * 1024 * 1024 - 4096 - base_bytes - report_size - reserve)
              selected = set()
              raw_used = 0
              omitted_by_artifact_limit = 0
              for member_row in report_value["differing_members"]:
                  for side in ("first", "second"):
                      state = member_row[side]
                      if not state.get("retained"):
                          continue
                      size = state["bytes"]
                      if size <= raw_budget - raw_used:
                          selected.add(state["path"])
                          raw_used += size
                      else:
                          state["retained"] = False
                          state.pop("path", None)
                          state["omitted_reason"] = "32 MiB host artifact retention ceiling"
                          omitted_by_artifact_limit += size
              report_value["raw_retained_bytes"] = raw_used
              report_value["raw_omitted_bytes"] += omitted_by_artifact_limit
              report_value["artifact_raw_retained_bytes"] = raw_used
              report_value["artifact_raw_omitted_bytes"] = omitted_by_artifact_limit
              for relative in sorted(selected):
                  target = destination.joinpath(*safe_relative(relative).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(source.joinpath(*safe_relative(relative).parts), target)
              report_target = destination / "report.json"
              report_target.write_text(json.dumps(report_value, sort_keys=True, indent=2) + "\n", encoding="utf-8")
              return {"cold-root-diagnostics/report.json"} | {
                  "cold-root-diagnostics/" + relative for relative in selected}

          expected_host = os.environ["EXPECTED_HOST"]
          reference_proposal = os.environ["REFERENCE_PROPOSAL"] == "true"
          expected_status = ("PRODUCED_NATIVE_REFERENCE_PROPOSAL_NOT_FOR_AUTHENTICATION"
                             if reference_proposal else "PRODUCED_HOSTED_SDK_CANDIDATE_NOT_R1_ACCEPTED")
          success = os.environ["PRODUCER_RESULT"] == "success"
          cargo_path = output / "producer.json"
          sdk_path = output / "sdk-producer.json"
          if not sdk_path.exists():
              failure = {"schema": "ami-rust-hosted-sdk-producer-v1", "status": "FAILED",
                         "host": expected_host, "error": "producer did not write sdk-producer.json",
                         "claim": "No SDK qualification or publication claim."}
              sdk_path.write_text(json.dumps(failure, sort_keys=True, indent=2) + "\n")
          sdk = read_json(sdk_path)
          if (sdk.get("schema") != "ami-rust-hosted-sdk-producer-v1"
                  or sdk.get("host") != expected_host
                  or sdk.get("status") not in {"FAILED", expected_status}):
              raise SystemExit("Unrecognized SDK producer receipt")
          if cargo_path.exists():
              cargo = read_json(cargo_path)
              if (cargo.get("schema") != "ami-rust-hosted-custom-cargo-producer-v1"
                      or cargo.get("host") != expected_host
                      or cargo.get("status") not in {"FAILED", "PRODUCED_PREREQUISITE_ONLY_NOT_R1_QUALIFICATION"}):
                  raise SystemExit("Unrecognized Cargo producer receipt")
          elif success:
              raise SystemExit("Successful SDK producer omitted the Cargo receipt")

          diagnostic_names = set()

          payload_names = {
              "sdk.tar.xz", "cargo-component.tar.xz",
              "native/minimal-noalloc.AMIRUST", "native/minimal-alloc.AMIRUST",
              "native/qualification.AMIRUST", "native/dependencies.AMIRUST",
              "native/sha256sum.AMIRUST"}
          if reference_proposal:
              payload_names |= {"metadata/" + name + ".rlib" for name in
                                ("serde", "curve25519_dalek", "ed25519_dalek")}
          if not success:
              for relative in sorted(payload_names):
                  path = output / relative
                  if path.is_symlink():
                      raise SystemExit("Unexpected linked partial payload")
                  if path.is_file():
                      path.unlink()
              native = output / "native"
              if native.exists():
                  if native.is_symlink() or not native.is_dir() or any(native.iterdir()):
                      raise SystemExit("Unexpected partial native output tree")
                  native.rmdir()
              metadata = output / "metadata"
              if metadata.exists():
                  if metadata.is_symlink() or not metadata.is_dir() or any(metadata.iterdir()):
                      raise SystemExit("Unexpected partial metadata output tree")
                  metadata.rmdir()
              diagnostics = work / "cold-root-diagnostics"
              if diagnostics.exists() or diagnostics.is_symlink():
                  diagnostic_names = retain_cold_root_diagnostics(diagnostics, output)

          if work.exists():
              shutil.rmtree(work)
          if work.exists():
              raise SystemExit("Managed SDK work tree was not retired")

          allowed = {"producer.json", "sdk-producer.json", "csdk-producer.json", "python-bootstrap.json", "cleanup.json"}
          allowed |= diagnostic_names
          if success:
              allowed |= payload_names
              if (sdk.get("status") != expected_status
                      or sdk.get("reference_proposal") is not reference_proposal
                      or sdk.get("source", {}).get("qualification_only") is not False):
                  raise SystemExit("Successful SDK producer did not emit a production trust candidate")
              csdk_path = output / "csdk-producer.json"
              csdk = read_json(csdk_path)
              csdk_binding = sdk.get("inputs", {}).get("portable_csdk", {})
              if (csdk.get("schema") != "ami-rust-portable-csdk-producer-v1"
                      or csdk.get("status") != "PRODUCED_CSDK_COMPONENT_CANDIDATE_NOT_R1_ACCEPTED"
                      or csdk.get("host") != expected_host
                      or sha256(csdk_path) != csdk_binding.get("producer_receipt_sha256")
                      or csdk.get("spec_sha256") != csdk_binding.get("spec", {}).get("sha256")):
                  raise SystemExit("Successful SDK producer omitted its exact fresh C-SDK proof")
              payload_rows = {}
              payload_rows[sdk["source"]["sdk_archive"]["path"]] = sdk["source"]["sdk_archive"]
              payload_rows[sdk["cargo_component"]["archive"]["path"]] = sdk["cargo_component"]["archive"]
              for row in sdk.get("native_payloads", []):
                  payload_rows[row["path"]] = row
              for row in sdk.get("metadata_archives", []):
                  payload_rows[row["path"]] = row
              if set(payload_rows) != payload_names:
                  raise SystemExit("SDK receipt payload inventory is incomplete")
              for relative, row in payload_rows.items():
                  path = output / relative
                  info = regular(path)
                  if info.st_size != row.get("bytes") or sha256(path) != row.get("sha256"):
                      raise SystemExit("Candidate payload differs from its receipt: " + relative)
              if (len(sdk.get("native_builds", [])) != 10
                      or (not reference_proposal and
                          any(row.get("reference_match") is not True for row in sdk["native_builds"]))):
                  raise SystemExit("SDK producer did not complete both full five-variant native roots")
              for variant in ("minimal-noalloc", "minimal-alloc", "qualification", "dependencies", "sha256sum"):
                  builds = [row for row in sdk["native_builds"] if row.get("variant") == variant]
                  if (len(builds) != 2 or {row.get("layout") for row in builds} != {"sdk-layout-a", "sdk-layout-b"}
                          or builds[0].get("canonical_artifacts") != builds[1].get("canonical_artifacts")
                          or not builds[0].get("canonical_artifacts")):
                      raise SystemExit("SDK producer did not prove matching cold roots for " + variant)
              if (not (output / "python-bootstrap.json").is_file()
                      or os.environ["PYTHON_RESULT"] != "success"):
                  raise SystemExit("Successful build is missing its pinned Python receipt")

          observed = set()
          total = 0
          for path in output.rglob("*"):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              relative = path.relative_to(output).as_posix()
              if not stat.S_ISREG(info.st_mode) or relative not in allowed:
                  raise SystemExit("Output may contain only selected JSON and candidate files")
              observed.add(relative)
              total += info.st_size
          if success and not payload_names <= observed:
              raise SystemExit("Successful SDK candidate omitted one or more payloads")
          if total > 32 * 1024 * 1024 - 4096:
              raise SystemExit("SDK metadata and candidate payloads exceed the 32 MiB retained ceiling")

          receipt = {"schema": "ami-rust-sdk-cleanup-v1",
                     "status": ("PASS" if success else
                                "PRODUCER_FAILED_WITH_COLD_ROOT_DIAGNOSTICS" if diagnostic_names else
                                "PRODUCER_FAILED_METADATA_ONLY"),
                     "producer_outcome": os.environ["PRODUCER_RESULT"],
                     "python_bootstrap_outcome": os.environ["PYTHON_RESULT"],
                     "source_commit": os.environ["WORKFLOW_SOURCE_COMMIT"],
                     "run_id": os.environ["WORKFLOW_RUN_ID"],
                     "run_attempt": os.environ["WORKFLOW_RUN_ATTEMPT"],
                     "candidate_output_bytes_observed": total,
                     "candidate_retention_ceiling_bytes": 32 * 1024 * 1024,
                     "managed_work_remaining_bytes": 0,
                     "python_runtime_remaining_bytes": 0,
                     "native_guest_tested": False,
                     "reference_proposal": reference_proposal,
                     "R1_accepted": False,
                     "SDK_publication_authorized": False}
          (output / "cleanup.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          final_bytes = sum(path.stat().st_size for path in output.rglob("*") if path.is_file() and not path.is_symlink())
          if final_bytes > 32 * 1024 * 1024:
              raise SystemExit("Final retained SDK artifact exceeds 32 MiB")
          print(json.dumps(receipt, sort_keys=True))
          PYCODE
      - name: Upload bounded host candidate and receipts
        if: always() && needs.admission.result == 'success' && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-candidate-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-sdk-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  native-producer:
    if: ${{ inputs.native_tooling && !inputs.reference_proposal }}
    needs: admission
    name: Native tooling producer (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            profile: linux-x86_64
            triple: x86_64-unknown-linux-gnu
          - os: macos-26
            profile: macos-aarch64
            triple: aarch64-apple-darwin
    steps:
      - name: Require protected main and the designated repository
        shell: bash
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$GITHUB_REPOSITORY" = metaneutrons/ami-rust
          test "$GITHUB_REF" = refs/heads/main
          test "$SOURCE_IS_PROTECTED" = true
      - name: Check out the exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned internal Python runtime
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - name: Bootstrap the pinned host Rust toolchain
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-native-host" '${{ matrix.triple }}'
      - name: Build native host SDK output
        id: producer
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_native.py host \
            --host '${{ matrix.profile }}' \
            --host-rust "$RUNNER_TEMP/ami-rust-native-host" \
            --work "$RUNNER_TEMP/ami-rust-native-work" \
            --output "$RUNNER_TEMP/ami-rust-native-output"
      - name: Validate bounded native host output
        id: validate-output
        if: ${{ steps.producer.outcome == 'success' }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / 'ami-rust-native-output'
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('native host output root must be a real directory')
          expected = {'ami-rust', 'sdk.tar.xz', 'sdk-manifest.json', 'native-host-producer.json'}
          observed = set()
          total = 0
          for path in root.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              relative = path.relative_to(root).as_posix()
              if not stat.S_ISREG(info.st_mode) or relative not in expected:
                  raise SystemExit('native host output contains an unexpected file')
              observed.add(relative)
              total += info.st_size
          if observed != expected or total > 16 * 1024**2:
              raise SystemExit('native host output inventory or 16 MiB artifact ceiling failed')
          print(json.dumps({'schema': 'ami-rust-native-host-output-bound-v1',
                            'files': len(observed), 'bytes': total}))
          PY
      - name: Upload native host output
        if: ${{ steps.producer.outcome == 'success' && steps.validate-output.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-host-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Emit bounded native producer diagnostics on failure
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          remaining = 48 * 1024
          for work in (root / 'ami-rust-native-work',):
              if work.is_symlink() or not work.is_dir():
                  continue
              for path in sorted(work.rglob('*.log')):
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or remaining <= 0:
                      continue
                  amount = min(12 * 1024, remaining)
                  with path.open('rb') as stream:
                      stream.seek(max(0, info.st_size - amount))
                      raw = stream.read(amount)
                  remaining -= len(raw)
                  print(json.dumps({'native_diagnostic': path.name,
                                    'tail': raw.decode('utf-8', errors='replace')}))
          PY
      - name: Retire native producer work roots
        if: always()
        env:
          PRODUCER_RESULT: ${{ steps.producer.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          names = ('ami-rust-native-host', 'ami-rust-native-work', 'ami-rust-native-output', 'ami-rust-python-bootstrap')
          for name in names:
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked native producer work root')
              if path.exists():
                  if not path.is_dir():
                      raise SystemExit('unexpected native producer work root')
                  shutil.rmtree(path)
              if path.exists():
                  raise SystemExit('native producer work retirement failed')
          print(json.dumps({'schema': 'ami-rust-native-host-cleanup-v1',
                            'producer_outcome': os.environ['PRODUCER_RESULT'],
                            'remaining_bytes': 0}))
          PY

  release-candidate:
    name: Authenticate complete release transport
    if: ${{ !inputs.reference_proposal && !inputs.native_tooling }}
    needs: [consumer]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-authenticated-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-release-inner
      - name: Bootstrap pinned verifier tools and roots
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_verify.py bootstrap-tools \
            --work "$RUNNER_TEMP/ami-rust-release-work" \
            --output "$RUNNER_TEMP/ami-rust-release-bootstrap" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap"
          install -d -m 700 "$RUNNER_TEMP/ami-rust-release-output/metadata"
          install -m 600 "$RUNNER_TEMP/ami-rust-release-bootstrap/tool-bootstrap.json" \
            "$RUNNER_TEMP/ami-rust-release-output/metadata/tool-bootstrap.json"
      - name: Verify inner publisher evidence and prepare the exact transport
        id: prepare
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/candidate_auth.py prepare \
            --bundle "$RUNNER_TEMP/ami-rust-release-inner" \
            --candidate "$RUNNER_TEMP/ami-rust-release-output/candidate" \
            --work "$RUNNER_TEMP/ami-rust-release-work" \
            --metadata "$RUNNER_TEMP/ami-rust-release-output/metadata" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap"
      - name: Sign the payload and transport inventory
        shell: bash
        env:
          PAYLOAD: ${{ steps.prepare.outputs.payload_name }}
          TRANSPORT: ${{ steps.prepare.outputs.transport_name }}
          PAYLOAD_SIGNATURE: ${{ steps.prepare.outputs.payload_signature_name }}
          TRANSPORT_SIGNATURE: ${{ steps.prepare.outputs.transport_signature_name }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/ami-rust-release-output/candidate"
          "$RUNNER_TEMP/ami-rust-release-work/tools/cosign" sign-blob --yes \
            --bundle "$candidate/$PAYLOAD_SIGNATURE" "$candidate/$PAYLOAD"
          "$RUNNER_TEMP/ami-rust-release-work/tools/cosign" sign-blob --yes \
            --bundle "$candidate/$TRANSPORT_SIGNATURE" "$candidate/$TRANSPORT"
      - name: Finalize the complete checksum inventory
        id: final
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B - <<'PYCODE'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'release'))
          import stage_candidate
          candidate = Path(os.environ['RUNNER_TEMP']) / 'ami-rust-release-output/candidate'
          report = stage_candidate.finalize(candidate, os.environ['TAG'])
          name = stage_candidate.asset_names(os.environ['TAG'])['checksums']
          digest = hashlib.sha256((candidate / name).read_bytes()).hexdigest()
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
              stream.write('checksums_sha256=' + digest + '\n')
          (candidate.parent / 'metadata/outer-finalized.json').write_text(json.dumps(report, sort_keys=True, indent=2) + '\n')
          PYCODE
      - name: Attest transport payload
        id: attest-payload
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.payload_name }}
          subject-digest: sha256:${{ steps.prepare.outputs.payload_sha256 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-release-output/metadata/outer-predicate.json
      - name: Preserve transport payload attestation before the next invocation
        env:
          BUNDLE_PATH: ${{ steps.attest-payload.outputs.bundle-path }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ami-rust-release-attestations"
          install -m 600 "$BUNDLE_PATH" "$RUNNER_TEMP/ami-rust-release-attestations/payload.json"
      - name: Attest payload SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.sbom_name }}
          subject-digest: sha256:${{ steps.prepare.outputs.sbom_sha256 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-release-output/metadata/outer-predicate.json
      - name: Preserve payload SBOM attestation before the next invocation
        env:
          BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ami-rust-release-attestations"
          install -m 600 "$BUNDLE_PATH" "$RUNNER_TEMP/ami-rust-release-attestations/sbom.json"
      - name: Attest transport inventory
        id: attest-transport
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.transport_name }}
          subject-digest: sha256:${{ steps.prepare.outputs.transport_sha256 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-release-output/metadata/outer-predicate.json
      - name: Preserve transport inventory attestation before the next invocation
        env:
          BUNDLE_PATH: ${{ steps.attest-transport.outputs.bundle-path }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ami-rust-release-attestations"
          install -m 600 "$BUNDLE_PATH" "$RUNNER_TEMP/ami-rust-release-attestations/transport.json"
      - name: Attest complete checksums
        id: attest-checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.prepare.outputs.checksums_name }}
          subject-digest: sha256:${{ steps.final.outputs.checksums_sha256 }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-release-output/metadata/outer-predicate.json
      - name: Preserve checksums attestation
        env:
          BUNDLE_PATH: ${{ steps.attest-checksums.outputs.bundle-path }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/ami-rust-release-attestations"
          install -m 600 "$BUNDLE_PATH" "$RUNNER_TEMP/ami-rust-release-attestations/checksums.json"
      - name: Verify actual signatures, provenance and refusal counterprobes
        id: verify
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PAYLOAD: ${{ steps.prepare.outputs.payload_name }}
          SBOM: ${{ steps.prepare.outputs.sbom_name }}
          TRANSPORT: ${{ steps.prepare.outputs.transport_name }}
          CHECKSUMS: ${{ steps.prepare.outputs.checksums_name }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/candidate_auth.py verify \
            --bundle "$RUNNER_TEMP/ami-rust-release-inner" \
            --candidate "$RUNNER_TEMP/ami-rust-release-output/candidate" \
            --work "$RUNNER_TEMP/ami-rust-release-work" \
            --metadata "$RUNNER_TEMP/ami-rust-release-output/metadata" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            --gh "$PAYLOAD=$RUNNER_TEMP/ami-rust-release-attestations/payload.json" \
            --gh "$SBOM=$RUNNER_TEMP/ami-rust-release-attestations/sbom.json" \
            --gh "$TRANSPORT=$RUNNER_TEMP/ami-rust-release-attestations/transport.json" \
            --gh "$CHECKSUMS=$RUNNER_TEMP/ami-rust-release-attestations/checksums.json"
      - name: Retire release work and preserve bounded candidate evidence
        id: cleanup
        if: always()
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          python3 -I -B - <<'PYCODE'
          import json, os, shutil, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name in ('ami-rust-release-inner', 'ami-rust-release-work', 'ami-rust-release-bootstrap', 'ami-rust-release-attestations', 'ami-rust-python-bootstrap'):
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked release work root')
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  raise SystemExit('unexpected non-directory release work root')
              if path.exists():
                  raise SystemExit('release work retirement failed')
          output = root / 'ami-rust-release-output'
          if output.is_symlink():
              raise SystemExit('linked release output root')
          output.mkdir(exist_ok=True)
          metadata = output / 'metadata'
          if metadata.is_symlink():
              raise SystemExit('linked release metadata root')
          metadata.mkdir(exist_ok=True)
          if os.environ['VERIFY_RESULT'] == 'success':
              proof = metadata / 'outer-verification.json'
              if proof.is_symlink() or not proof.is_file() or proof.stat().st_size > 1024**2:
                  raise SystemExit('successful release step omitted its bounded verification receipt')
              verified = json.loads(proof.read_bytes())
              if (verified.get('status') != 'OUTER_CRYPTO_VERIFIED_NOT_R1_ACCEPTED'
                      or verified.get('source_commit') != os.environ['GITHUB_SHA']
                      or type(verified.get('run_id')) is not int
                      or verified['run_id'] != int(os.environ['GITHUB_RUN_ID'])
                      or type(verified.get('run_attempt')) is not int
                      or verified['run_attempt'] != int(os.environ['GITHUB_RUN_ATTEMPT'])):
                  raise SystemExit('release verification receipt differs from actual source/run')
          total = 0
          for path in output.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit('nonregular release output')
              total += info.st_size
          if total > 96 * 1024**2 - 4096:
              raise SystemExit('release candidate and proofs exceed admitted 96 MiB output')
          receipt = {'schema':'ami-rust-release-candidate-cleanup-v1', 'remaining_work_bytes':0,
                     'source_sha':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                     'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'output_bytes_observed':total,
                     'verification_outcome':os.environ['VERIFY_RESULT'], 'SDK_published':False}
          (metadata / 'cleanup.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt))
          PYCODE
      - name: Preserve candidate, real proofs and outcome
        if: always() && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-release-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  assemble:
    if: ${{ !inputs.reference_proposal && !inputs.native_tooling }}
    name: Assemble common unsigned candidate
    needs: producer
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Python
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-candidate-macos-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-payloads/macos-aarch64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-candidate-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-payloads/linux-x86_64
      - name: Assemble exact common candidate from both producer payloads
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_auth.py prepare \
            --source "$GITHUB_WORKSPACE" \
            --macos "$RUNNER_TEMP/ami-rust-payloads/macos-aarch64" \
            --linux "$RUNNER_TEMP/ami-rust-payloads/linux-x86_64" \
            --output "$RUNNER_TEMP/ami-rust-common-candidate"
      - name: Preserve bounded unsigned candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-common-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-common-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Retire assembly inputs and runtime
        if: always()
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          retired = []
          for name in ('ami-rust-payloads', 'ami-rust-common-candidate', 'ami-rust-python-bootstrap'):
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked assembly root')
              if path.exists():
                  shutil.rmtree(path)
              if path.exists():
                  raise SystemExit('assembly retirement failed')
              retired.append(name)
          print(json.dumps({'schema':'ami-rust-assembly-cleanup-v1', 'retired':retired, 'remaining_bytes':0}))
          PY

  native-assemble:
    if: ${{ inputs.native_tooling && !inputs.reference_proposal }}
    name: Assemble native common candidate
    needs: native-producer
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned internal Python runtime
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - name: Bootstrap the pinned Linux host Rust toolchain
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-native-host" x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-host-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-payloads/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-host-macos-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-payloads/macos-aarch64
      - name: Assemble the exact native release candidate
        id: assemble
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_native.py assemble \
            --host-rust "$RUNNER_TEMP/ami-rust-native-host" \
            --work "$RUNNER_TEMP/ami-rust-native-assembly" \
            --linux "$RUNNER_TEMP/ami-rust-native-payloads/linux-x86_64" \
            --macos "$RUNNER_TEMP/ami-rust-native-payloads/macos-aarch64" \
            --output "$RUNNER_TEMP/ami-rust-common-candidate"
      - name: Preserve bounded unsigned native candidate
        if: ${{ steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-common-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-common-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Emit bounded native assembly diagnostics on failure
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          work = Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / 'ami-rust-native-assembly'
          remaining = 48 * 1024
          if not work.is_symlink() and work.is_dir():
              for path in sorted(work.rglob('*.log')):
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or remaining <= 0:
                      continue
                  amount = min(12 * 1024, remaining)
                  with path.open('rb') as stream:
                      stream.seek(max(0, info.st_size - amount))
                      raw = stream.read(amount)
                  remaining -= len(raw)
                  print(json.dumps({'native_diagnostic': path.name,
                                    'tail': raw.decode('utf-8', errors='replace')}))
          PY
      - name: Retire native assembly work roots
        if: always()
        env:
          ASSEMBLY_RESULT: ${{ steps.assemble.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          names = ('ami-rust-native-host', 'ami-rust-native-assembly',
                   'ami-rust-native-payloads', 'ami-rust-common-candidate', 'ami-rust-python-bootstrap')
          for name in names:
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked native assembly work root')
              if path.exists():
                  if not path.is_dir():
                      raise SystemExit('unexpected native assembly work root')
                  shutil.rmtree(path)
              if path.exists():
                  raise SystemExit('native assembly work retirement failed')
          print(json.dumps({'schema': 'ami-rust-native-assembly-cleanup-v1',
                            'assembly_outcome': os.environ['ASSEMBLY_RESULT'],
                            'remaining_bytes': 0}))
          PY

  authenticate:
    name: Authenticate candidate (${{ matrix.profile }})
    if: ${{ always() && !inputs.reference_proposal && (needs.assemble.result == 'success' || needs['native-assemble'].result == 'success') }}
    needs: [assemble, native-assemble]
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: ${{ inputs.native_tooling && 20 || 10 }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-26
            profile: macos-aarch64
            triple: aarch64-apple-darwin
          - os: ubuntu-24.04
            profile: linux-x86_64
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned native host Rust toolchain
        if: ${{ inputs.native_tooling }}
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-native-host" '${{ matrix.triple }}'
      - name: Install pinned Python
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-common-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-auth-candidate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.native_tooling }}
        with:
          name: native-host-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-payloads/linux-x86_64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.native_tooling }}
        with:
          name: native-host-macos-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-payloads/macos-aarch64
      - name: Bootstrap pinned authentication tools
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_verify.py bootstrap-tools \
            --work "$RUNNER_TEMP/ami-rust-auth-work" --output "$RUNNER_TEMP/ami-rust-auth-metadata" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap"
      - name: Independently reconstruct the candidate before signing
        id: subjects
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_TOOLING: ${{ inputs.native_tooling }}
        run: |
          if [ "$NATIVE_TOOLING" = true ]; then
            "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_native.py audit \
              --host-rust "$RUNNER_TEMP/ami-rust-native-host" \
              --work "$RUNNER_TEMP/ami-rust-signer-audit" \
              --bundle "$RUNNER_TEMP/ami-rust-auth-candidate" \
              --linux "$RUNNER_TEMP/ami-rust-native-payloads/linux-x86_64" \
              --macos "$RUNNER_TEMP/ami-rust-native-payloads/macos-aarch64"
          else
            "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_auth.py audit \
              --source "$GITHUB_WORKSPACE" --bundle "$RUNNER_TEMP/ami-rust-auth-candidate" \
              --work "$RUNNER_TEMP/ami-rust-signer-audit"
          fi
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_auth.py predicate \
            --bundle "$RUNNER_TEMP/ami-rust-auth-candidate" --host '${{ matrix.profile }}' \
            --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/ami-rust-predicate.json"
      - name: Attest release manifest
        id: attest-manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: release.json
          subject-digest: sha256:${{ steps.subjects.outputs.manifest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-predicate.json
      - name: Preserve manifest attestation before the next invocation
        env:
          BUNDLE_PATH: ${{ steps.attest-manifest.outputs.bundle-path }}
        run: python3 -I -B -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ami-rust-gh-manifest.json").write_bytes(pathlib.Path(os.environ["BUNDLE_PATH"]).read_bytes())'
      - name: Attest source SDK
        id: attest-sdk
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: sdk.tar.xz
          subject-digest: sha256:${{ steps.subjects.outputs.sdk }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-predicate.json
      - name: Preserve SDK attestation before the next invocation
        env:
          BUNDLE_PATH: ${{ steps.attest-sdk.outputs.bundle-path }}
        run: python3 -I -B -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ami-rust-gh-sdk.json").write_bytes(pathlib.Path(os.environ["BUNDLE_PATH"]).read_bytes())'
      - name: Attest native reference utility
        id: attest-utility
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: SHAUTIL
          subject-digest: sha256:${{ steps.subjects.outputs.utility }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/ami-rust-predicate.json
      - name: Preserve utility attestation
        env:
          BUNDLE_PATH: ${{ steps.attest-utility.outputs.bundle-path }}
        run: python3 -I -B -c 'import os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"ami-rust-gh-utility.json").write_bytes(pathlib.Path(os.environ["BUNDLE_PATH"]).read_bytes())'
      - name: Create real keyless signatures for the three exact subjects
        shell: bash
        run: |
          "$RUNNER_TEMP/ami-rust-auth-work/tools/cosign" sign-blob --yes \
            --bundle "$RUNNER_TEMP/ami-rust-cosign-manifest.json" "$RUNNER_TEMP/ami-rust-auth-candidate/release.json"
          "$RUNNER_TEMP/ami-rust-auth-work/tools/cosign" sign-blob --yes \
            --bundle "$RUNNER_TEMP/ami-rust-cosign-sdk.json" "$RUNNER_TEMP/ami-rust-auth-candidate/sdk.tar.xz"
          "$RUNNER_TEMP/ami-rust-auth-work/tools/cosign" sign-blob --yes \
            --bundle "$RUNNER_TEMP/ami-rust-cosign-utility.json" "$RUNNER_TEMP/ami-rust-auth-candidate/SHAUTIL"
      - name: Freeze authentication mappings
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_auth.py finalize \
            --bundle "$RUNNER_TEMP/ami-rust-auth-candidate" --host '${{ matrix.profile }}' \
            --gh "release.json=$RUNNER_TEMP/ami-rust-gh-manifest.json" \
            --gh "sdk.tar.xz=$RUNNER_TEMP/ami-rust-gh-sdk.json" \
            --gh "SHAUTIL=$RUNNER_TEMP/ami-rust-gh-utility.json" \
            --cosign "release.json=$RUNNER_TEMP/ami-rust-cosign-manifest.json" \
            --cosign "sdk.tar.xz=$RUNNER_TEMP/ami-rust-cosign-sdk.json" \
            --cosign "SHAUTIL=$RUNNER_TEMP/ami-rust-cosign-utility.json"
      - name: Validate bounded native authenticated candidate
        id: validate-native-auth
        if: ${{ inputs.native_tooling }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True) / 'ami-rust-auth-candidate'
          if root.is_symlink() or not root.is_dir():
              raise SystemExit('native authenticated candidate root must be a real directory')
          total = 0
          for path in root.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit('native authenticated candidate contains a nonregular file')
              total += info.st_size
          if total > 64 * 1024**2:
              raise SystemExit('native authenticated candidate exceeds its 64 MiB artifact ceiling')
          print(json.dumps({'schema': 'ami-rust-native-authenticated-bound-v1', 'bytes': total}))
          PY
      - name: Preserve authenticated candidate for independent consumption
        if: ${{ !inputs.native_tooling || steps.validate-native-auth.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-authenticated-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-auth-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Emit bounded signer diagnostics on failure
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          remaining = 48 * 1024
          for name in ('ami-rust-signer-audit', 'ami-rust-signer-audit-expected'):
              work = root / name
              if work.is_symlink() or not work.is_dir():
                  continue
              for path in sorted(work.rglob('*.log')):
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or remaining <= 0:
                      continue
                  amount = min(12 * 1024, remaining)
                  with path.open('rb') as stream:
                      stream.seek(max(0, info.st_size - amount))
                      raw = stream.read(amount)
                  remaining -= len(raw)
                  print(json.dumps({'native_diagnostic': path.name,
                                    'tail': raw.decode('utf-8', errors='replace')}))
          PY
      - name: Retire signer inputs, tools and runtime
        if: always()
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          names = ('ami-rust-auth-candidate', 'ami-rust-auth-work', 'ami-rust-auth-metadata',
                   'ami-rust-python-bootstrap', 'ami-rust-signer-audit', 'ami-rust-predicate.json',
                   'ami-rust-signer-audit-expected', 'ami-rust-native-host', 'ami-rust-native-payloads',
                   'ami-rust-gh-manifest.json', 'ami-rust-gh-sdk.json', 'ami-rust-gh-utility.json',
                   'ami-rust-cosign-manifest.json', 'ami-rust-cosign-sdk.json', 'ami-rust-cosign-utility.json')
          for name in names:
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked signer root')
              if path.is_dir():
                  shutil.rmtree(path)
              elif path.exists():
                  path.unlink()
              if path.exists():
                  raise SystemExit('signer retirement failed')
          print(json.dumps({'schema':'ami-rust-authentication-cleanup-v1', 'remaining_bytes':0}))
          PY

  native-consumer:
    if: ${{ inputs.native_tooling }}
    name: Native signed lifecycle (${{ matrix.profile }})
    needs: authenticate
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-26
            profile: macos-aarch64
            triple: aarch64-apple-darwin
          - os: ubuntu-24.04
            profile: linux-x86_64
            triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap the pinned Python runtime
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - name: Bootstrap the pinned host Rust toolchain
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-native-host" '${{ matrix.triple }}'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-authenticated-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-consumer-candidate
      - name: Verify the signed native SDK lifecycle
        id: verify
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_native.py verify \
            --host-rust "$RUNNER_TEMP/ami-rust-native-host" \
            --work "$RUNNER_TEMP/ami-rust-native-consumer-work" \
            --output "$RUNNER_TEMP/ami-rust-native-consumer-output" \
            --bundle "$RUNNER_TEMP/ami-rust-native-consumer-candidate" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap"
      - name: Emit bounded native consumer diagnostics on failure
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          remaining = 48 * 1024
          for name in ('ami-rust-native-consumer-work', 'ami-rust-native-verifier-work',
                       'ami-rust-native-verifier-metadata'):
              work = root / name
              if work.is_symlink() or not work.is_dir():
                  continue
              for path in sorted(work.rglob('*.log')):
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or remaining <= 0:
                      continue
                  amount = min(12 * 1024, remaining)
                  with path.open('rb') as stream:
                      stream.seek(max(0, info.st_size - amount))
                      raw = stream.read(amount)
                  remaining -= len(raw)
                  print(json.dumps({'native_diagnostic': path.name,
                                    'tail': raw.decode('utf-8', errors='replace')}))
          PY
      - name: Retire native consumer inputs and bound retained evidence
        id: cleanup
        if: always()
        env:
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          retired = ('ami-rust-native-host', 'ami-rust-native-consumer-work',
                     'ami-rust-native-verifier-work', 'ami-rust-native-verifier-metadata',
                     'ami-rust-native-consumer-candidate', 'ami-rust-python-bootstrap')
          for name in retired:
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked native consumer work root')
              if path.exists():
                  if not path.is_dir():
                      raise SystemExit('unexpected native consumer work root')
                  shutil.rmtree(path)
              if path.exists():
                  raise SystemExit('native consumer work retirement failed')
          output = root / 'ami-rust-native-consumer-output'
          if output.is_symlink():
              raise SystemExit('linked native consumer output root')
          output.mkdir(exist_ok=True)
          total = 0
          for path in output.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit('nonregular native consumer evidence')
              total += info.st_size
          if total > 32 * 1024**2 - 4096:
              raise SystemExit('native consumer evidence exceeds its 32 MiB artifact ceiling')
          receipt = {'schema': 'ami-rust-native-consumer-cleanup-v1',
                     'verification_outcome': os.environ['VERIFY_RESULT'],
                     'output_bytes': total, 'retired': list(retired)}
          (output / 'cleanup.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve bounded native lifecycle evidence
        if: always() && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-native-consumer-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-native-consumer-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  consumer:
    if: ${{ !inputs.native_tooling }}
    name: Independent consumer (${{ matrix.profile }})
    needs: authenticate
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: macos-26
            profile: macos-aarch64
          - os: ubuntu-24.04
            profile: linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute documented Python preparation
        env:
          SOURCE: ${{ github.workspace }}
          PYTHON_BOOTSTRAP: ${{ runner.temp }}/ami-rust-python-bootstrap
        run: |
          python3 -I -B - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          text = (Path(os.environ['SOURCE']) / 'release/bundle-assets/QUICKSTART.md').read_text()
          blocks = re.findall(r'```sh\n(.*?)\n```', text, re.S)
          commands = [line for block in blocks for line in block.splitlines()
                      if line.startswith('python3 -I -B "$SOURCE/release/ci_python.py" ')]
          if len(commands) != 1:
              raise SystemExit('Expected exactly one documented pinned Python command')
          subprocess.run(['/bin/sh', '-c', 'set -eu\n' + commands[0]], check=True, timeout=1200)
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-authenticated-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-consumer-candidate
      - name: Verify real evidence, counter-probes and complete consumer replay
        id: qualification
        env:
          SOURCE_IS_PROTECTED: ${{ github.ref_protected }}
          PUBLISHER_ENVIRONMENT: release
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B release/ci_verify.py qualify \
            --bundle "$RUNNER_TEMP/ami-rust-consumer-candidate" \
            --work "$RUNNER_TEMP/ami-rust-consumer-work" --output "$RUNNER_TEMP/ami-rust-consumer-output" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap"
      - name: Retire consumer work and preserve bounded evidence
        id: cleanup
        if: always()
        run: |
          python3 -I -B - <<'PY'
          import json, os, shutil, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          for name in ('ami-rust-consumer-candidate', 'ami-rust-consumer-work', 'ami-rust-python-bootstrap'):
              path = root / name
              if path.is_symlink():
                  raise SystemExit('linked consumer root')
              if path.exists():
                  shutil.rmtree(path)
              if path.exists():
                  raise SystemExit('consumer retirement failed')
          output = root / 'ami-rust-consumer-output'
          if output.is_symlink():
              raise SystemExit('linked consumer output')
          output.mkdir(exist_ok=True)
          total = 0
          for path in output.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit('nonregular consumer evidence')
              total += info.st_size
          if total > 32 * 1024**2 - 4096:
              raise SystemExit('consumer evidence exceeds retained ceiling')
          receipt = {'schema':'ami-rust-consumer-cleanup-v1', 'remaining_work_bytes':0,
                     'source_sha':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                     'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'output_bytes_observed':total}
          (output / 'cleanup.json').write_text(json.dumps(receipt, sort_keys=True) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Preserve independent verification and native replay evidence
        if: always() && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-consumer-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-consumer-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
