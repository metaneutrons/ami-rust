name: RC1 Linux Git HTTPS transport diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/rc1-linux-git-transport-diagnostic.yml
      - release/ci-bootstrap-inputs.json
      - release/ci-resources.json
      - release/native-tooling-inputs.json
      - tooling/Cargo.lock
      - tooling/Cargo.toml
      - tooling/crates/core/src/process_capture.rs
      - tooling/crates/xtask/src/consumer_observe.rs
      - tooling/crates/xtask/src/consumer_report.rs
      - tooling/crates/xtask/src/consumer_runtime.rs
      - tools/bootstrap-host-rust.sh
      - tools/consumer-enforcement-adapter/**

permissions:
  contents: read

concurrency:
  group: rc1-linux-git-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-git-transport:
    name: Linux Git helper process observations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create private diagnostic roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-linux-git-transport"
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-linux-git-transport/tmp"

      - name: Install hash-pinned Rust 1.98.1 for Linux x86-64
        shell: bash
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-linux-git-rust" x86_64-unknown-linux-gnu

      - name: Fetch locked crates and build the adapter and test binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rust_bin="$RUNNER_TEMP/ami-rust-linux-git-rust/toolchain/bin"
          export RUSTC="$rust_bin/rustc"
          export RUSTDOC="$rust_bin/rustdoc"
          export CARGO_HOME="$RUNNER_TEMP/ami-rust-linux-git-cargo-home"
          export CARGO_BUILD_JOBS=2
          export RUSTC_WRAPPER=
          export RUSTC_WORKSPACE_WRAPPER=
          export TMPDIR="$RUNNER_TEMP/ami-rust-linux-git-transport/tmp"
          export PATH="$rust_bin:/usr/bin:/bin:/usr/sbin:/sbin"
          "$rust_bin/cargo" fetch --locked --manifest-path tooling/Cargo.toml
          "$rust_bin/cargo" fetch --locked --manifest-path tools/consumer-enforcement-adapter/Cargo.toml
          "$rust_bin/cargo" build --locked --offline \
            --manifest-path tools/consumer-enforcement-adapter/Cargo.toml \
            --target-dir "$RUNNER_TEMP/ami-rust-linux-git-adapter-target"
          "$rust_bin/cargo" test --no-run --locked --offline \
            --manifest-path tooling/Cargo.toml \
            --package ami-rust-xtask --bin ami-rust-xtask \
            --target-dir "$RUNNER_TEMP/ami-rust-linux-git-xtask-target" \
            --message-format=json \
            > "$RUNNER_TEMP/ami-rust-linux-git-transport/test-build.jsonl"
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/test-build.jsonl" \
            "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = row.get("target", {})
              if (row.get("reason") == "compiler-artifact"
                      and target.get("name") == "ami-rust-xtask"
                      and "bin" in target.get("kind", [])
                      and row.get("profile", {}).get("test") is True
                      and isinstance(row.get("executable"), str)):
                  records.append(row["executable"])
          if len(records) != 1:
              raise SystemExit(f"expected one xtask unit-test binary, got {len(records)}")
          Path(sys.argv[2]).write_text(records[0] + "\n")
          PY

      - name: Run the ignored diagnostic under strace when already available
        id: diagnostic
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          AMI_RUST_LINUX_GIT_DIAGNOSTIC_ARTIFACT_ROOT: ${{ runner.temp }}/ami-rust-linux-git-transport/test-output
          AMI_RUST_LINUX_GIT_DIAGNOSTIC_ADAPTER: ${{ runner.temp }}/ami-rust-linux-git-adapter-target/debug/consumer-enforcement-adapter
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt"
          test_binary=$(cat "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt")
          trace="$RUNNER_TEMP/ami-rust-linux-git-transport/strace.log"
          set +e
          if command -v strace >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=15s 1185s \
              strace -f -s256 -e trace=process,file -o "$trace" \
              "$test_binary" --ignored --exact consumer_observe::tests::linux_git_https_transport_diagnostic
            result=$?
            trace_mode=used
          else
            timeout --signal=TERM --kill-after=15s 1185s \
              "$test_binary" --ignored --exact consumer_observe::tests::linux_git_https_transport_diagnostic
            result=$?
            trace_mode=unavailable
          fi
          set -e
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/run-status.json" "$result" "$trace_mode" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "schema": "ami-rust-linux-git-transport-run-status-v1",
              "test_exit_code": int(sys.argv[2]),
              "strace": sys.argv[3],
              "claim": "Diagnostic run only; not RC1 or resource acceptance.",
          }, indent=2) + "\n")
          PY
          exit "$result"

      - name: Retain bounded traces and diagnostic output
        if: always()
        shell: bash
        run: |
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/strace.log" \
            "$RUNNER_TEMP/ami-rust-linux-git-transport/trace-capture.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          trace = Path(sys.argv[1])
          cap = 16 * 1024 * 1024
          result = {"schema": "ami-rust-linux-git-transport-trace-capture-v1",
                    "status": "STRACE_UNAVAILABLE_OR_NOT_STARTED", "original_bytes": 0,
                    "retained_bytes": 0, "truncated": False, "limit_bytes": cap}
          if trace.is_file() and not trace.is_symlink():
              size = trace.stat().st_size
              result.update(status="STRACE_TRACE_RETAINED", original_bytes=size,
                            retained_bytes=size)
              if size > cap:
                  marker = b"\n[trace truncated; tail follows]\n"
                  half = (cap - len(marker)) // 2
                  with trace.open("rb") as stream:
                      head = stream.read(half)
                      stream.seek(size - half)
                      tail = stream.read(half)
                  trace.write_bytes(head + marker + tail)
                  result.update(retained_bytes=trace.stat().st_size, truncated=True)
          Path(sys.argv[2]).write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc1-linux-git-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-linux-git-transport/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
