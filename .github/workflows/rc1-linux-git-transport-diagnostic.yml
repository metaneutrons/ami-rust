name: RC1 Linux Git HTTPS transport diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/rc1-linux-git-transport-diagnostic.yml
      - release/ci-bootstrap-inputs.json
      - release/ci-resources.json
      - release/native-tooling-inputs.json
      - tooling/Cargo.lock
      - tooling/Cargo.toml
      - tooling/crates/core/src/process_capture.rs
      - tooling/crates/xtask/src/consumer_observe.rs
      - tooling/crates/xtask/src/consumer_report.rs
      - tooling/crates/xtask/src/consumer_runtime.rs
      - tooling/crates/xtask/src/cold_runtime_probe.rs
      - tooling/crates/xtask/src/fork_runtime_probe.rs
      - tooling/crates/xtask/src/host_link_probe.rs
      - release/ci_native.py
      - release/ci_sdk.py
      - release/ci_cargo.py
      - release/ci_auth.py
      - release/ci_python.py
      - release/ci-python-inputs.json
      - release/ci-sdk-inputs.json
      - tools/bootstrap-host-rust.sh
      - tools/consumer-enforcement-adapter/**

permissions:
  contents: read

concurrency:
  group: rc1-linux-git-transport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-git-transport:
    name: Linux Git helper process observations
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create private diagnostic roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-linux-git-transport"
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-linux-git-transport/tmp"

      - name: Install hash-pinned Rust 1.98.1 for Linux x86-64
        shell: bash
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-linux-git-rust" x86_64-unknown-linux-gnu

      - name: Fetch locked crates and build the adapter and test binary
        id: build
        shell: bash
        run: |
          set -euo pipefail
          rust_bin="$RUNNER_TEMP/ami-rust-linux-git-rust/toolchain/bin"
          export RUSTC="$rust_bin/rustc"
          export RUSTDOC="$rust_bin/rustdoc"
          export CARGO_HOME="$RUNNER_TEMP/ami-rust-linux-git-cargo-home"
          export CARGO_BUILD_JOBS=2
          export RUSTC_WRAPPER=
          export RUSTC_WORKSPACE_WRAPPER=
          export TMPDIR="$RUNNER_TEMP/ami-rust-linux-git-transport/tmp"
          export PATH="$rust_bin:/usr/bin:/bin:/usr/sbin:/sbin"
          "$rust_bin/cargo" fetch --locked --manifest-path tooling/Cargo.toml
          "$rust_bin/cargo" fetch --locked --manifest-path tools/consumer-enforcement-adapter/Cargo.toml
          "$rust_bin/cargo" build --locked --offline \
            --manifest-path tools/consumer-enforcement-adapter/Cargo.toml \
            --target-dir "$RUNNER_TEMP/ami-rust-linux-git-adapter-target"
          "$rust_bin/cargo" test --no-run --locked --offline \
            --manifest-path tooling/Cargo.toml \
            --package ami-rust-xtask --bin ami-rust-xtask \
            --target-dir "$RUNNER_TEMP/ami-rust-linux-git-xtask-target" \
            --message-format=json \
            > "$RUNNER_TEMP/ami-rust-linux-git-transport/test-build.jsonl"
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/test-build.jsonl" \
            "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              target = row.get("target", {})
              if (row.get("reason") == "compiler-artifact"
                      and target.get("name") == "ami-rust-xtask"
                      and "bin" in target.get("kind", [])
                      and row.get("profile", {}).get("test") is True
                      and isinstance(row.get("executable"), str)):
                  records.append(row["executable"])
          if len(records) != 1:
              raise SystemExit(f"expected one xtask unit-test binary, got {len(records)}")
          Path(sys.argv[2]).write_text(records[0] + "\n")
          PY

      - name: Run the ignored diagnostic under strace when already available
        id: diagnostic
        if: steps.build.outcome == 'success'
        shell: bash
        env:
          AMI_RUST_LINUX_GIT_DIAGNOSTIC_ARTIFACT_ROOT: ${{ runner.temp }}/ami-rust-linux-git-transport/test-output
          AMI_RUST_LINUX_GIT_DIAGNOSTIC_ADAPTER: ${{ runner.temp }}/ami-rust-linux-git-adapter-target/debug/consumer-enforcement-adapter
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt"
          test_binary=$(cat "$RUNNER_TEMP/ami-rust-linux-git-transport/test-binary.txt")
          trace="$RUNNER_TEMP/ami-rust-linux-git-transport/strace.log"
          set +e
          if command -v strace >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=15s 1185s \
              strace -f -s256 -e trace=process,file -o "$trace" \
              "$test_binary" --ignored --exact consumer_observe::tests::linux_git_https_transport_diagnostic
            result=$?
            trace_mode=used
          else
            timeout --signal=TERM --kill-after=15s 1185s \
              "$test_binary" --ignored --exact consumer_observe::tests::linux_git_https_transport_diagnostic
            result=$?
            trace_mode=unavailable
          fi
          set -e
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/run-status.json" "$result" "$trace_mode" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(json.dumps({
              "schema": "ami-rust-linux-git-transport-run-status-v1",
              "test_exit_code": int(sys.argv[2]),
              "strace": sys.argv[3],
              "claim": "Diagnostic run only; not RC1 or resource acceptance.",
          }, indent=2) + "\n")
          PY
          exit "$result"

      - name: Bootstrap pinned Python for native probe resource supervision
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B release/ci_python.py \
            --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            --inputs release/ci-python-inputs.json

      - name: Prove pinned compiler runtime and host linker admission with omission controls
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B - <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          source = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          sys.path.insert(0, str(source / "release"))
          import ci_native as native

          root = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
          work = root / "ami-rust-linux-cold-runtime-work"
          output = root / "ami-rust-linux-git-transport/cold-runtime-resource-output"
          python = root / "ami-rust-python-bootstrap"
          for path in (work, output):
              if path.exists() or path.is_symlink():
                  raise SystemExit("cold runtime resource roots must be fresh")
              path.mkdir(mode=0o700)
          for name in ("home", "tmp"):
              (work / name).mkdir(mode=0o700)
          binary = Path((root / "ami-rust-linux-git-transport/test-binary.txt").read_text().strip())
          env = {"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "LC_ALL": "C", "TZ": "UTC",
                 "HOME": str(work / "home"), "TMPDIR": str(work / "tmp"),
                 "AMI_RUST_COLD_RUNTIME_SOURCE_ROOT": str(source),
                 "AMI_RUST_COLD_RUNTIME_ADAPTER": str(root / "ami-rust-linux-git-adapter-target/debug/consumer-enforcement-adapter"),
                 "AMI_RUST_COLD_RUNTIME_WORK_ROOT": str(work / "case"),
                 "AMI_RUST_COLD_RUNTIME_ARTIFACT_ROOT": str(output / "probe"),
                 "AMI_RUST_HOST_LINK_COMPONENT": str(work / "case/extracted/rustc-nightly-x86_64-unknown-linux-gnu/rustc"),
                 "AMI_RUST_HOST_LINK_ADAPTER": str(root / "ami-rust-linux-git-adapter-target/debug/consumer-enforcement-adapter"),
                 "AMI_RUST_HOST_LINK_WORK_ROOT": str(work / "host-link"),
                 "AMI_RUST_HOST_LINK_ARTIFACT_ROOT": str(output / "host-link-probe")}
          supervisor = native._make_supervisor(work, output, python, env,
              static_roots=[("pinned-host-rust", root / "ami-rust-linux-git-rust"),
                            ("adapter-build", root / "ami-rust-linux-git-adapter-target"),
                            ("probe-build", root / "ami-rust-linux-git-xtask-target")])
          status = "FAILED_OR_INCOMPLETE_CAUSE_SPECIFIC_PROBE"
          try:
              row = native._supervised_run(supervisor,
                  [binary, "--ignored", "--exact", "consumer_observe::tests::linux_cold_rustc_runtime_dependency_regression",
                   "--test-threads=1"], label="linux-cold-rustc-runtime-regression", timeout=1200)
              stdout = (work / row["stdout_log"]).read_text()
              if (stdout.splitlines().count("running 1 test") != 1
                      or stdout.splitlines().count("test consumer_observe::tests::linux_cold_rustc_runtime_dependency_regression ... ok") != 1
                      or sum(line.startswith("test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured;")
                             for line in stdout.splitlines()) != 1):
                  raise RuntimeError("expected exactly one completed cold runtime regression test")
              probe = json.loads((output / "probe/probe-result.json").read_text())
              if (probe.get("schema") != "ami-rust-linux-cold-rustc-runtime-probe-v1"
                      or probe.get("status") != "PASS"
                      or not isinstance(probe.get("counter_cleanup"), dict)
                      or probe["counter_cleanup"].get("gate_passed") is not True
                      or not isinstance(probe.get("pinned_cargo_fork"), dict)
                      or probe["pinned_cargo_fork"].get("status") != "PASS"
                      or any(probe.get(key) is not True for key in
                             ("counter_gate_passed", "positive_gate_passed", "source_bindings_unchanged"))):
                  raise RuntimeError("cold runtime positive and omission-control evidence is incomplete")
              native._check_limits(supervisor, "completed cold compiler runtime regression")
              row = native._supervised_run(supervisor,
                  [binary, "--ignored", "--exact", "consumer_observe::tests::linux_pinned_host_linker_regression",
                   "--test-threads=1"], label="linux-pinned-host-linker-regression", timeout=1200)
              stdout = (work / row["stdout_log"]).read_text()
              if (stdout.splitlines().count("running 1 test") != 1
                      or stdout.splitlines().count("test consumer_observe::tests::linux_pinned_host_linker_regression ... ok") != 1
                      or sum(line.startswith("test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured;")
                             for line in stdout.splitlines()) != 1):
                  raise RuntimeError("expected exactly one completed host linker regression test")
              link_probe = json.loads((output / "host-link-probe/probe-result.json").read_text())
              if (link_probe.get("status") != "PASS"
                      or any(link_probe.get(key) is not True for key in
                             ("counter_gate_passed", "positive_gate_passed", "source_bindings_unchanged",
                              "system_link_input_gate_passed"))):
                  raise RuntimeError("pinned host linker positive and omission-control evidence is incomplete")
              controls = link_probe.get("system_link_input_controls")
              if (not isinstance(controls, list) or len(controls) != 4
                      or {row.get("name") for row in controls}
                         != {"libutil.a", "librt.a", "libpthread.a", "libdl.a"}
                      or any(row.get("gate_passed") is not True
                             or row.get("no_elf_output") is not True
                             or row.get("policy_omission", {}).get("all_other_policy_bytes_identical") is not True
                             for row in controls)):
                  raise RuntimeError("Rust host system-library read-rule omission controls are incomplete")
              native._check_limits(supervisor, "completed pinned host linker regression")
              status = "PASS_CAUSE_SPECIFIC_RUNTIME_AND_LINKER_PROBES_NOT_FULL_COLD_CLI_OR_RC1_ACCEPTANCE"
          finally:
              for row in supervisor.commands:
                  for key in ("stdout_log", "stderr_log"):
                      if row.get(key):
                          path = work / row[key]
                          shutil.copyfile(path, output / path.name)
              native.write(output / "resource-supervision.json", native.auth.encoded({
                  "schema": "ami-rust-linux-cold-runtime-resource-supervision-v1",
                  "status": status, "source_sha": os.environ["GITHUB_SHA"],
                  "supervision": native._supervision_summary(supervisor),
                  "claim": "Cause-specific pinned compiler loader and GCC/LLD link regressions only. Full authenticated CLI cold preparation, native build and both-host RC1 qualification remain required."}))
              native._check_limits(supervisor, "cold compiler runtime regression evidence")
          PY

      - name: Retain bounded traces and diagnostic output
        if: always()
        shell: bash
        run: |
          python3 -I -B - "$RUNNER_TEMP/ami-rust-linux-git-transport/strace.log" \
            "$RUNNER_TEMP/ami-rust-linux-git-transport/trace-capture.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          trace = Path(sys.argv[1])
          cap = 16 * 1024 * 1024
          result = {"schema": "ami-rust-linux-git-transport-trace-capture-v1",
                    "status": "STRACE_UNAVAILABLE_OR_NOT_STARTED", "original_bytes": 0,
                    "retained_bytes": 0, "truncated": False, "limit_bytes": cap}
          if trace.is_file() and not trace.is_symlink():
              size = trace.stat().st_size
              result.update(status="STRACE_TRACE_RETAINED", original_bytes=size,
                            retained_bytes=size)
              if size > cap:
                  marker = b"\n[trace truncated; tail follows]\n"
                  half = (cap - len(marker)) // 2
                  with trace.open("rb") as stream:
                      head = stream.read(half)
                      stream.seek(size - half)
                      tail = stream.read(half)
                  trace.write_bytes(head + marker + tail)
                  result.update(retained_bytes=trace.stat().st_size, truncated=True)
          Path(sys.argv[2]).write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc1-linux-git-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-linux-git-transport/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
