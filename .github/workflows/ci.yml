name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths and check the diff
        id: classify
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) echo 'code=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # An initial push has no comparable base. Unknown input must retain
          # the complete Rust matrix rather than being treated as documentation.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "${base}^{commit}" || {
            echo "::error::base commit ${base} is not in the clone"
            exit 1
          }

          docs='(^docs/|^website/|^assets/([^/]+\.(svg|png|jpg|jpeg|gif|webp)|README\.md)$|^\.github/ISSUE_TEMPLATE/|^\.github/pull_request_template\.md$|\.md$)'
          classify_paths() {
            local code=false file
            while IFS= read -r file; do
              [[ -n "$file" && ! "$file" =~ $docs ]] && code=true
            done
            printf '%s\n' "$code"
          }

          # Keep the allowlist fail-closed. These probes cover documentation,
          # source, workflow, lockfile, near-miss and mixed path sets.
          test "$(printf '%s\n' README.md docs/guide.md website/src/content.config.ts assets/mark.svg | classify_paths)" = false
          test "$(printf '%s\n' tooling/src/lib.rs | classify_paths)" = true
          test "$(printf '%s\n' .github/workflows/ci.yml | classify_paths)" = true
          test "$(printf '%s\n' tooling/Cargo.lock | classify_paths)" = true
          test "$(printf '%s\n' notes.markdown | classify_paths)" = true
          test "$(printf '%s\n' README.md tooling/src/lib.rs | classify_paths)" = true

          git diff --check "$base" HEAD
          code="$(git diff --name-only "$base" HEAD | classify_paths)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed paths require full Rust CI: $code"

  rust:
    name: Rust workspace (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-26
            triple: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build the pinned Rust maintainer task
        env:
          HOST_TRIPLE: ${{ matrix.triple }}
        shell: bash
        run: bash tools/build-maintainer-task.sh "$RUNNER_TEMP/ami-rust-ci" "$HOST_TRIPLE"

      - name: Check the Rust workspace and release components offline
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ami-rust-ci"
          toolchain="$work/bootstrap/toolchain"
          mkdir -m 700 "$work/test-target"
          env -i \
            HOME="$work/home" TMPDIR="$work/tmp" \
            PATH="$toolchain/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            CARGO_HOME="$work/cargo-home" CARGO_TARGET_DIR="$work/test-target" \
            CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true \
            RUSTC="$toolchain/bin/rustc" RUSTDOC="$toolchain/bin/rustdoc" \
            RUSTC_WRAPPER='' RUSTC_WORKSPACE_WRAPPER='' \
            LC_ALL=C TZ=UTC SOURCE_DATE_EPOCH=1791936000 \
            "$toolchain/bin/cargo" check --workspace --all-targets --locked --offline \
              --manifest-path tooling/Cargo.toml -j 2
          for filter in production_contract toolchain_release; do
            env -i \
              HOME="$work/home" TMPDIR="$work/tmp" \
              PATH="$toolchain/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
              CARGO_HOME="$work/cargo-home" CARGO_TARGET_DIR="$work/test-target" \
              CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 CARGO_NET_OFFLINE=true \
              RUSTC="$toolchain/bin/rustc" RUSTDOC="$toolchain/bin/rustdoc" \
              RUSTC_WRAPPER='' RUSTC_WORKSPACE_WRAPPER='' \
              LC_ALL=C TZ=UTC SOURCE_DATE_EPOCH=1791936000 \
              "$toolchain/bin/cargo" test --package ami-rust-core --lib "$filter" \
                --locked --offline --manifest-path tooling/Cargo.toml -j 2
          done

      - name: Check the frozen production contract
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ami-rust-ci/target/release/ami-rust-xtask" \
            toolchain-release-cutover check \
            --source-root "$GITHUB_WORKSPACE" \
            --contract release/rust-production-contract.json \
            --version "$(<version.txt)" \
            --output "$RUNNER_TEMP/rp4-contract-check.json"

  ci-success:
    name: CI Success
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful classification and all selected Rust jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$RUST_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
