name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer-fixtures:
    name: Installer fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            contract/
            crates/
            examples/
            tests/
            host/
            native/sdk.h
            release/*.py
            release/ci-*.json
            release/native-tooling-inputs.json
            tooling/Cargo.lock
            tooling/Cargo.toml
            tooling/fixtures/accepted-r1-inputs.json
            release/ci-cargo-producers/
            release/trust/
            release/portable-csdk/spec.json
            release/native-reference.json
            release/candidate-r4/
            release/bundle-assets/
            release/bundle-files.json
            release/cargo-notices/payload-v3/
            docs/
            licences/
            LICENSE*
            qualification/hosted_capacity.py
            qualification/test_hosted_capacity.py
            .github/workflows/sdk-qualify.yml
            .github/workflows/public-replay.yml
      - name: Run isolated installer fixture tests
        run: |
          python3 --version
          test -x /usr/bin/ssh-keygen
          python3 -I -B release/test_install.py
          python3 -I -B release/test_cargo_notice_inventory.py
          python3 -I -B host/test_contracts.py
          python3 -I -B host/tests/test_host_capacity.py
          python3 -I -B host/tests/test_allocation_layout.py
          python3 -I -B host/tests/test_elf_audit.py
          python3 -I -B release/test_ci_cargo.py
          python3 -I -B release/test_cargo_context_probe.py
          python3 -I -B release/test_finalize_cargo_probe.py
          python3 -I -B release/test_ci_python.py
          python3 -I -B release/test_ci_artifact_admission.py
          python3 -I -B release/test_ci_sdk.py
          python3 -I -B release/test_sdk_storage_accounting.py
          python3 -I -B release/test_ci_csdk.py
          python3 -I -B release/test_csdk_recipes.py
          python3 -I -B release/test_csdk_nouveau.py
          python3 -I -B release/test_csdk_archive.py
          python3 -I -B release/test_csdk_metadata.py
          python3 -I -B release/test_csdk_producer.py
          python3 -I -B release/test_prepare_sdk.py
          python3 -I -B release/test_ci_auth.py
          python3 -I -B release/test_native_tooling_materials.py
          python3 -I -B release/test_ci_native.py
          python3 -I -B release/test_ci_native_upgrade.py
          python3 -I -B release/test_ci_native_outer.py
          python3 -I -B release/test_contract_probes.py
          python3 -I -B release/test_ci_verify.py
          python3 -I -B release/test_public_transport.py
          python3 -I -B release/test_public_candidate.py
          python3 -I -B release/test_public_replay.py
          python3 -I -B release/test_stage_candidate.py
          python3 -I -B release/test_stage_draft.py
          python3 -I -B release/test_candidate_auth.py
          python3 -I -B release/test_consumer_inputs.py
          python3 -I -B qualification/test_hosted_capacity.py
          python3 -I -B release/test_verify_publisher.py
          python3 -I -B release/test_install_publisher.py

  packaging-fixtures:
    name: Packaging fixtures (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out packaging test inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            packaging/
            release/*.py
            release/ci-*.json
            LICENSE*
      - name: Run retained package verification library fixtures
        run: |
          python3 --version
          for suite in packaging/test_auth.py packaging/test_control.py packaging/test_fetch.py packaging/test_measure.py packaging/test_verify_apt.py packaging/test_publish_tap.py; do
            python3 -I -B "$suite"
          done

  rust-migration-scope:
    name: Select Rust migration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.scope.outputs.affected }}
    steps:
      - name: Check out the exact comparison source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/ci.yml
      - name: Select affected prototype and pin changes
        id: scope
        env:
          CLI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          [[ "$CLI_BASE" =~ ^[0-9a-f]{40}$ ]]
          if [ "$CLI_BASE" = 0000000000000000000000000000000000000000 ]; then
            printf 'affected=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$CLI_BASE^{commit}"; then
            git fetch --no-tags --filter=blob:none --depth=1 origin "$CLI_BASE"
          fi
          if git diff --quiet "$CLI_BASE" "$GITHUB_SHA" -- Cargo.toml Cargo.lock crates/ examples/ tests/ targets/ tools/ tooling/ host/profiles/ host/contracts.py docs/rust-cli-migration/contracts-v1.json .github/workflows/ci.yml release/ci-bootstrap-inputs.json release/ci-sdk-inputs.json release/native-tooling-inputs.json release/ci-python-inputs.json release/ci_historical.py release/install.py release/test_install.py release/verify_publisher.py release/ci_native.py release/ci_sdk.py release/ci_auth.py release/ci_cargo.py release/prepare_sdk.py release/ci_python.py; then
            printf 'affected=false\n' >> "$GITHUB_OUTPUT"
          else
            cli_diff_status=$?
            test "$cli_diff_status" = 1
            printf 'affected=true\n' >> "$GITHUB_OUTPUT"
          fi

  rust-migration-fixtures:
    name: Rust migration fixtures (${{ matrix.os }})
    needs: rust-migration-scope
    if: needs.rust-migration-scope.outputs.affected == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - os: macos-26
            triple: aarch64-apple-darwin
    steps:
      - name: Check out isolated Rust migration and host inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
            crates/
            examples/
            tests/
            targets/
            tools/
            tooling/
            host/profiles/
            host/contracts.py
            docs/rust-cli-migration/contracts-v1.json
            release/ci-bootstrap-inputs.json
            release/ci-sdk-inputs.json
            release/native-tooling-inputs.json
            release/ci-python-inputs.json
            release/ci-resources.json
            release/ci_python.py
            release/ci_historical.py
            release/ci_native.py
            release/ci_auth.py
            release/ci_sdk.py
            release/ci_cargo.py
            release/prepare_sdk.py
            release/install.py
            release/test_install.py
            release/verify_publisher.py
      - name: Install the existing hash-pinned host Rust inputs
        env:
          CLI_HOST_TRIPLE: ${{ matrix.triple }}
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-rc0-host" "$CLI_HOST_TRIPLE"
      - name: Test the standalone Rust prototypes offline
        run: |
          set -euo pipefail
          cli_rust="$RUNNER_TEMP/ami-rust-rc0-host/toolchain/bin"
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-core-home" "$RUNNER_TEMP/ami-rust-core-tmp"
          env -i CLI_RUST="$cli_rust" RUNNER_TEMP="$RUNNER_TEMP" \
            HOME="$RUNNER_TEMP/ami-rust-core-home" TMPDIR="$RUNNER_TEMP/ami-rust-core-tmp" \
            PATH="$cli_rust:/usr/bin:/bin:/usr/sbin:/sbin" LC_ALL=C \
            /bin/bash -euo pipefail <<'RUST_TESTS'
          cli_rust="$CLI_RUST"
          export RUSTC="$cli_rust/rustc"
          export RUSTDOC="$cli_rust/rustdoc"
          export CARGO_HOME="$RUNNER_TEMP/ami-rust-rc0-cargo-home"
          export CARGO_BUILD_JOBS=2
          export PATH="$cli_rust:/usr/bin:/bin:/usr/sbin:/sbin"
          export RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER=
          # The separate host-core candidate has a reviewed registry lock. Fetch
          # its authenticated checksum-bound archives before offline execution.
          "$cli_rust/cargo" fetch --locked \
            --manifest-path tools/host-contract-deps/Cargo.toml
          for cli_probe in cargo-native-spike no-python-probe host-contract-deps consumer-enforcement-adapter; do
            "$cli_rust/cargo" test --locked --offline \
              --manifest-path "tools/$cli_probe/Cargo.toml" \
              --target-dir "$RUNNER_TEMP/ami-rust-rc0-$cli_probe"
          done
          # Retained library/resource behavior is checked on both supported hosts;
          # this is not replacement toolchain/SDK qualification.
          "$cli_rust/cargo" fetch --locked --manifest-path tooling/Cargo.toml
          "$cli_rust/cargo" test --workspace --locked --offline \
            --manifest-path tooling/Cargo.toml \
            --target-dir "$RUNNER_TEMP/ami-rust-host-core"
          RUST_TESTS
      - name: Check retained no-Python observer controls
        run: |
          set -euo pipefail
          # Python is an intentional detector counter, not a consumer dependency.
          python3 -I -B release/ci_python.py \
            --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            --inputs release/ci-python-inputs.json
          cli_rust="$RUNNER_TEMP/ami-rust-rc0-host/toolchain/bin"
          mkdir -m 700 "$RUNNER_TEMP/ami-rust-historical-home" "$RUNNER_TEMP/ami-rust-historical-tmp"
          env -i PATH="$cli_rust:/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME="$RUNNER_TEMP/ami-rust-historical-home" TMPDIR="$RUNNER_TEMP/ami-rust-historical-tmp" \
            RUSTC="$cli_rust/rustc" RUSTDOC="$cli_rust/rustdoc" \
            RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= CARGO_BUILD_JOBS=2 LC_ALL=C \
            CARGO_HOME="$RUNNER_TEMP/ami-rust-rc0-cargo-home" \
            "$cli_rust/cargo" build --locked --offline \
            --manifest-path tools/consumer-enforcement-adapter/Cargo.toml \
            --target-dir "$RUNNER_TEMP/ami-rust-rc0-consumer-enforcement-adapter"
          env -i PATH="$cli_rust:/usr/bin:/bin:/usr/sbin:/sbin" \
            HOME="$RUNNER_TEMP/ami-rust-historical-home" TMPDIR="$RUNNER_TEMP/ami-rust-historical-tmp" \
            RUSTC="$cli_rust/rustc" RUSTDOC="$cli_rust/rustdoc" \
            RUSTC_WRAPPER= RUSTC_WORKSPACE_WRAPPER= CARGO_BUILD_JOBS=2 LC_ALL=C \
            CARGO_HOME="$RUNNER_TEMP/ami-rust-rc0-cargo-home" \
            AMI_RUST_CONSUMER_ENFORCEMENT_ADAPTER="$RUNNER_TEMP/ami-rust-rc0-consumer-enforcement-adapter/debug/consumer-enforcement-adapter" \
            AMI_RUST_CONSUMER_ENFORCEMENT_PYTHON_ROOT="$RUNNER_TEMP/ami-rust-python-bootstrap/runtime" \
            AMI_RUST_CONSUMER_ENFORCEMENT_WORK="$RUNNER_TEMP/ami-rust-enforcement-controls-work" \
            AMI_RUST_CONSUMER_ENFORCEMENT_OUTPUT="$RUNNER_TEMP/ami-rust-enforcement-controls-output" \
            "$cli_rust/cargo" test --package ami-rust-xtask --test consumer_enforcement \
            --locked --offline --manifest-path tooling/Cargo.toml \
            --target-dir "$RUNNER_TEMP/ami-rust-host-core" \
            -- --ignored --exact native_interpreter_controls_are_refused_under_the_adapter_policy
          test -f "$RUNNER_TEMP/ami-rust-enforcement-controls-output/consumer-enforcement-controls.json"
      - name: Retain observer control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observer-controls-${{ matrix.triple }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ami-rust-enforcement-controls-output/**/*.json
            ${{ runner.temp }}/ami-rust-enforcement-controls-output/**/*.raw
            ${{ runner.temp }}/ami-rust-enforcement-controls-output/**/*.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  ci-success:
    name: CI Success
    if: always()
    needs: [installer-fixtures, packaging-fixtures, rust-migration-scope, rust-migration-fixtures]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every fixture job to pass
        env:
          PACKAGING_RESULT: ${{ needs.packaging-fixtures.result }}
          INSTALLER_RESULT: ${{ needs.installer-fixtures.result }}
          RUST_MIGRATION_RESULT: ${{ needs.rust-migration-fixtures.result }}
          RUST_MIGRATION_SCOPE_RESULT: ${{ needs.rust-migration-scope.result }}
          RUST_MIGRATION_AFFECTED: ${{ needs.rust-migration-scope.outputs.affected }}
        run: |
          set -euo pipefail
          test "$INSTALLER_RESULT" = success
          test "$PACKAGING_RESULT" = success
          test "$RUST_MIGRATION_SCOPE_RESULT" = success
          if [ "$RUST_MIGRATION_AFFECTED" = true ]; then
            test "$RUST_MIGRATION_RESULT" = success
          else
            test "$RUST_MIGRATION_AFFECTED" = false
            test "$RUST_MIGRATION_RESULT" = skipped
          fi
