name: RC1 Linux metadata diagnosis

on:
  pull_request:
    paths:
      - .github/workflows/rc1-linux-metadata-probe.yml
      - release/rc1_linux_metadata_probe.py

permissions:
  contents: read
  actions: read

concurrency:
  group: rc1-linux-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-metadata:
    name: Original SDK ordinary and observed metadata comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap pinned internal Python
        run: python3 -I -B release/ci_python.py --prefix "$RUNNER_TEMP/ami-rust-python-bootstrap" --inputs release/ci-python-inputs.json
      - name: Bootstrap pinned host Rust
        run: bash tools/bootstrap-host-rust.sh "$RUNNER_TEMP/ami-rust-metadata-host" x86_64-unknown-linux-gnu
      - name: Read the original authenticated SDK candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '12302941425'
          run-id: '39501724105'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ami-rust-metadata-original-bundle
          merge-multiple: true
      - name: Read the original Linux native launcher
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '12302325266'
          run-id: '39501724105'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ami-rust-metadata-original-host
          merge-multiple: true
      - name: Read the original independently selected publisher policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '12302994328'
          run-id: '39501724105'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ami-rust-metadata-original-consumer
          merge-multiple: true
      - name: Compare ordinary execution and two fresh observed builds
        id: probe
        run: |
          set -euo pipefail
          chmod 755 "$RUNNER_TEMP/ami-rust-metadata-original-host/ami-rust"
          "$RUNNER_TEMP/ami-rust-python-bootstrap/runtime/python/bin/python3.12" -I -B \
            release/rc1_linux_metadata_probe.py \
            --host-rust "$RUNNER_TEMP/ami-rust-metadata-host" \
            --python-bootstrap-root "$RUNNER_TEMP/ami-rust-python-bootstrap" \
            --work "$RUNNER_TEMP/ami-rust-metadata-work" \
            --output "$RUNNER_TEMP/ami-rust-metadata-output" \
            --bundle "$RUNNER_TEMP/ami-rust-metadata-original-bundle" \
            --original-policy "$RUNNER_TEMP/ami-rust-metadata-original-consumer/native-publisher-policy.json" \
            --launcher "$RUNNER_TEMP/ami-rust-metadata-original-host/ami-rust"
      - name: Emit bounded diagnostics after a failed probe
        if: failure()
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          work = root / 'ami-rust-metadata-work'
          candidates = list((work / 'build-runs').glob('*/derived/build/commands/*/*.log'))
          for directory in (work / 'logs', root / 'ami-rust-metadata-work-verifier-work/logs'):
              candidates.extend(directory.glob('*.log'))
          remaining = 48 * 1024
          for path in sorted(candidates):
              if remaining <= 0:
                  break
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or path.resolve(strict=True) != path:
                  continue
              amount = min(12 * 1024, remaining)
              with path.open('rb') as stream:
                  stream.seek(max(0, info.st_size - amount))
                  raw = stream.read(amount)
              remaining -= len(raw)
              print(json.dumps({'metadata_diagnostic': path.relative_to(root).as_posix(),
                                'tail': raw.decode('utf-8', errors='replace')}))
          PY
      - name: Bound retained diagnostic evidence
        id: retention
        if: always()
        env:
          PROBE_RESULT: ${{ steps.probe.outcome }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, stat
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          output = root / 'ami-rust-metadata-output'
          if output.is_symlink():
              raise SystemExit('linked metadata diagnostic output')
          output.mkdir(mode=0o700, exist_ok=True)
          total = 0
          for path in output.rglob('*'):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode):
                  raise SystemExit('nonregular metadata diagnostic evidence')
              total += info.st_size
          if total > 32 * 1024**2 - 4096:
              raise SystemExit('metadata diagnostic evidence exceeds 32 MiB')
          (output / 'retention.json').write_text(json.dumps({
              'schema': 'ami-rust-rc1-metadata-diagnostic-retention-v1',
              'probe_outcome': os.environ['PROBE_RESULT'], 'output_bytes': total,
              'scope': 'Diagnosis of original SDK39501724105 only; no qualification, signing or publication.'
          }, sort_keys=True) + '\n')
          PY
      - name: Preserve bounded original-candidate diagnosis
        if: always() && steps.retention.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rc1-linux-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ami-rust-metadata-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
